<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Receive Returned Asset · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad" style="max-width:760px;">
    <div class="section-title">1. Select Employee</div>
    <div class="field" style="max-width:380px;">
      <label>Employee returning the asset *</label>
      <select id="employee-select"><option value="">Select an employee…</option></select>
    </div>
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="scan-card">
    <div class="section-title">2. Scan / Enter Asset</div>
    <input type="text" id="scan-input" placeholder="Scan or enter QR Code / Asset ID, then press Enter" style="width:100%; border:1px solid var(--slate-300); border-radius:6px; padding:9px 10px; font-size:14px;" />
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="inspect-card">
    <div class="section-title">3. Inspect Returned Asset</div>
    <div id="asset-summary" class="muted" style="margin-bottom:14px;"></div>
    <form id="inspection-form" class="field-grid">
      <div class="field">
        <label>Asset Condition *</label>
        <select name="AssetCondition" required>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
          <option value="Poor">Poor</option>
          <option value="Damaged">Damaged</option>
        </select>
      </div>
      <div class="field">
        <label>Inspection Outcome *</label>
        <div class="pill-toggle" id="outcome-toggle">
          <button type="button" class="active" data-outcome="Fit for Service">Fit for Service</button>
          <button type="button" data-outcome="Repair Required">Repair Required</button>
        </div>
      </div>
      <div class="field span-2"><label>Damage Description</label><textarea name="DamageDescription" placeholder="Leave blank if no damage"></textarea></div>
      <div class="field span-2"><label>Missing Components / Accessories</label><textarea name="MissingComponents" placeholder="Leave blank if complete"></textarea></div>
      <div class="field span-2"><label>Inspection Notes</label><textarea name="InspectionNotes"></textarea></div>
      <div class="field span-2"><label>Inspection Photo (optional)</label><input type="file" name="photo" accept="image/*" /></div>

      <div class="form-actions" style="grid-column:1/-1;">
        <button type="submit" class="btn btn-primary">Complete Return</button>
      </div>
    </form>
  </div>

  <div class="card card-pad" id="result-card" style="display:none; margin-top:20px;">
    <div class="section-title">Return Complete</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, nowISO, nextId,
    findActiveAssignment, adjustEmployeeAssetCount, recordMovement, findEmployeeLocation,
  } from "./shared/common.js";
  import { doc, addDoc, collection, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("return-asset", "Receive Returned Asset");

  let employees = [];
  let selectedEmployee = null;
  let assetToReturn = null;
  let outcome = "Fit for Service";

  async function init() {
    employees = (await fetchAll(COLLECTIONS.EMPLOYEE_REGISTER)).filter((e) => e.EmploymentStatus === "Active");
    employees.sort((a, b) => (a.FullName || "").localeCompare(b.FullName || ""));
    const select = document.getElementById("employee-select");
    select.innerHTML = '<option value="">Select an employee…</option>';
    employees.forEach((e) => select.appendChild(el("option", { value: e.id }, e.FullName)));
  }

  function selectReturningEmployee(id) {
    selectedEmployee = employees.find((emp) => emp.id === id) || null;
    document.getElementById("employee-select").value = selectedEmployee ? selectedEmployee.id : "";
    document.getElementById("scan-card").style.display = selectedEmployee ? "" : "none";
    document.getElementById("inspect-card").style.display = "none";
    assetToReturn = null;
  }
  document.getElementById("employee-select").addEventListener("change", (e) => selectReturningEmployee(e.target.value));

  async function findAssetByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (direct) return direct;
    const all = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    return all.find((a) => a.QRCode === value) || null;
  }

  async function loadAssetForReturn(value) {
    if (!selectedEmployee) {
      toast("Select an employee first.", "info");
      return;
    }
    const asset = await findAssetByIdentifier(value);
    if (!asset) {
      toast('Asset Not Found — "Invalid QR Code. Asset cannot be Identified."', "error");
      return;
    }
    if (asset.CurrentEmployee && asset.CurrentEmployee !== selectedEmployee.id) {
      toast(`Asset is not allocated to the selected employee — please scan an asset assigned to ${selectedEmployee.FullName}.`, "error");
      return;
    }
    assetToReturn = asset;
    document.getElementById("scan-input").value = "";
    document.getElementById("asset-summary").textContent = `${asset.AssetName} — ${asset.id} · ${asset.Category || ""} ${asset.AssetType || ""}`;
    document.getElementById("inspection-form").reset();
    setOutcome("Fit for Service");
    document.getElementById("inspect-card").style.display = "";
  }

  document.getElementById("scan-input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    await loadAssetForReturn(value);
  });

  function setOutcome(value) {
    outcome = value;
    document.querySelectorAll("#outcome-toggle button").forEach((b) => b.classList.toggle("active", b.dataset.outcome === value));
  }
  document.getElementById("outcome-toggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-outcome]");
    if (btn) setOutcome(btn.dataset.outcome);
  });

  document.getElementById("inspection-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!assetToReturn || !selectedEmployee) return;
    const fd = new FormData(e.target);
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const now = nowISO();
      const actorName = getActingAs().name || "Unknown";

      // Optional inspection photo
      let photoUrl = null;
      const photoFile = fd.get("photo");
      if (photoFile && photoFile.size > 0) {
        const photoRef = ref(storage, `assets/${assetToReturn.id}/inspections/${Date.now()}_${photoFile.name}`);
        await uploadBytes(photoRef, photoFile);
        photoUrl = await getDownloadURL(photoRef);
      }

      // Close the active assignment and log a Return record
      const active = await findActiveAssignment(assetToReturn.id);
      if (active) {
        await updateDoc(doc(db, COLLECTIONS.ASSIGNMENT_HISTORY, active.id), { AssignmentEndDate: now });
      }
      await addDoc(collection(db, COLLECTIONS.ASSIGNMENT_HISTORY), {
        AssetID: assetToReturn.id,
        EmployeeID: selectedEmployee.id,
        AssignmentType: "Return",
        AssignmentStartDate: now,
        AssignmentEndDate: now,
        PreviousEmployeeID: null,
        CompletedBy: actorName,
        Notes: `Returned by ${selectedEmployee.FullName}`,
        CreatedDate: now,
        CreatedBy: actorName,
      });

      const newStatus = outcome === "Repair Required" ? "Under Repair" : "Available";
      let repairId = null;
      if (outcome === "Repair Required") {
        repairId = await nextId("REP", 4);
        await setDoc(doc(db, COLLECTIONS.REPAIR_REGISTER, repairId), {
          AssetID: assetToReturn.id,
          RepairStatus: "Awaiting Manager Approval",
          RepairType: null,
          RepairProvidor: null,
          RepairQuotation: null,
          EstimatedRepairCost: null,
          ReplacementCost: assetToReturn.ReplacementCost || null,
          RepairCostPercentage: null,
          RepairRecommendation: null,
          RecommendationReason: null,
          ManagerDecision: "Awaiting Decision",
          RepairDate: null,
          RepairCost: null,
          RepairNotes: fd.get("DamageDescription") || null,
          CompletionDate: null,
          BeyondRepair: false,
          CreatedDate: now,
          CreatedBy: actorName,
        });
      }

      // Returned Asset Inspection record
      const inspectionId = await nextId("INS", 4);
      await setDoc(doc(db, COLLECTIONS.ASSET_INSPECTION, inspectionId), {
        AssetID: assetToReturn.id,
        AssignmentHistoryID: active ? active.id : null,
        InspectionStatus: "Completed",
        InspectionDate: now,
        InspectedBy: actorName,
        AssetCondition: fd.get("AssetCondition"),
        InspectionOutcome: outcome,
        DamageDescription: fd.get("DamageDescription") || null,
        MissingComponents: fd.get("MissingComponents") || null,
        InspectionNotes: fd.get("InspectionNotes") || null,
        InspectionPhotos: photoUrl,
        AssetStatusAfterInspection: newStatus,
        RepairID: repairId,
        CreatedDate: now,
        CreatedBy: actorName,
      });

      await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, assetToReturn.id), {
        Status: newStatus,
        Condition: fd.get("AssetCondition"),
        CurrentEmployee: null,
        CurrentLocation: null,
      });

      await recordMovement({
        assetId: assetToReturn.id,
        action: "Returned by Employee",
        fromLocation: await findEmployeeLocation(selectedEmployee.id),
        toLocation: null,
        notes: `Returned by ${selectedEmployee.FullName} — ${outcome}`,
      });

      await updateDoc(doc(db, COLLECTIONS.EMPLOYEE_REGISTER, selectedEmployee.id), { LastAssetReturn: now });
      await adjustEmployeeAssetCount(selectedEmployee.id, -1);

      await logAudit({
        recordType: "Asset",
        recordId: assetToReturn.id,
        action: "Update",
        description: `${assetToReturn.AssetName} (${assetToReturn.id}) returned by ${selectedEmployee.FullName} — ${outcome}`,
      });

      document.getElementById("result-card").style.display = "";
      document.getElementById("result-body").innerHTML = "";
      document.getElementById("result-body").appendChild(
        el("div", {}, [
          el("p", {}, `${assetToReturn.AssetName} (${assetToReturn.id}) returned — outcome: ${outcome}.`),
          el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(assetToReturn.id)}` }, "Open asset record →"),
        ])
      );
      toast("Return complete", "success");

      document.getElementById("inspect-card").style.display = "none";
      assetToReturn = null;
    } catch (err) {
      console.error(err);
      toast("Could not complete return: " + err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const employeeId = params.get("employee");
    const assetId = params.get("asset");
    if (employeeId && employees.some((e) => e.id === employeeId)) {
      selectReturningEmployee(employeeId);
      if (assetId) await loadAssetForReturn(assetId);
    }
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
