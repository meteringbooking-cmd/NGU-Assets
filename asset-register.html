<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Register · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="page-toolbar">
    <input type="search" class="search-input" id="search-input" placeholder="Search by name, asset ID, serial number, manufacturer…" />
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <input type="text" id="scan-input" placeholder="Scan / enter QR or Asset ID" style="border:1px solid var(--slate-300); border-radius:6px; padding:9px 10px; font-size:14px; min-width:200px;" />
      <select id="filter-status" class="filter-select"></select>
      <select id="filter-category" class="filter-select"></select>
      <a class="btn btn-primary" href="create-asset.html">+ Create Asset</a>
    </div>
  </div>

  <div class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Asset ID</th>
          <th>Name</th>
          <th>Category</th>
          <th>Type</th>
          <th>Serial Number</th>
          <th>Status</th>
          <th>Condition</th>
          <th>Location</th>
          <th>Assigned To</th>
        </tr>
      </thead>
      <tbody id="rows"><tr class="loading-row"><td colspan="9">Loading asset register…</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { COLLECTIONS } from "./shared/collections.js";
  import { initLayout, el, $, toast, debounce, fetchAll } from "./shared/common.js";

  initLayout("asset-register", "Asset Register");

  const STATUS_BADGE = {
    Available: "green",
    Assigned: "teal",
    "Awaiting Inspection": "amber",
    "Under Repair": "amber",
    "Away for Calibration": "amber",
    Retired: "slate",
    Missing: "red",
    Stolen: "red",
  };

  let allAssets = [];

  async function load() {
    document.getElementById("rows").innerHTML = `<tr class="loading-row"><td colspan="9">Loading asset register…</td></tr>`;
    allAssets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    allAssets.sort((a, b) => (a.AssetName || "").localeCompare(b.AssetName || ""));
    populateFilters();
    render();
  }

  function populateFilters() {
    const statusSelect = document.getElementById("filter-status");
    const categorySelect = document.getElementById("filter-category");
    const statuses = [...new Set(allAssets.map((a) => a.Status).filter(Boolean))];
    const categories = [...new Set(allAssets.map((a) => a.Category).filter(Boolean))];
    statusSelect.innerHTML = '<option value="">All statuses</option>' + statuses.map((s) => `<option value="${s}">${s}</option>`).join("");
    categorySelect.innerHTML = '<option value="">All categories</option>' + categories.map((c) => `<option value="${c}">${c}</option>`).join("");
  }

  function goToAsset(id) {
    window.location.href = `asset-record.html?id=${encodeURIComponent(id)}`;
  }

  function render() {
    const tbody = document.getElementById("rows");
    const term = ($("#search-input").value || "").toLowerCase();
    const statusFilter = document.getElementById("filter-status").value;
    const categoryFilter = document.getElementById("filter-category").value;
    tbody.innerHTML = "";

    const rows = allAssets.filter((a) => {
      if (statusFilter && a.Status !== statusFilter) return false;
      if (categoryFilter && a.Category !== categoryFilter) return false;
      if (!term) return true;
      return [a.AssetName, a.id, a.SerialNumber, a.Manufacturer, a.Model, a.QRCode].join(" ").toLowerCase().includes(term);
    });

    if (rows.length === 0) {
      tbody.appendChild(
        el("tr", { class: "static-row" }, el("td", { colspan: "9", class: "empty-state" },
          allAssets.length === 0
            ? "No assets registered yet — create your first asset to get started."
            : "No assets match your search / filters."
        ))
      );
      return;
    }

    rows.forEach((a) => {
      tbody.appendChild(
        el("tr", { onclick: () => goToAsset(a.id) }, [
          el("td", {}, a.id),
          el("td", {}, a.AssetName || "—"),
          el("td", {}, a.Category || "—"),
          el("td", {}, a.AssetType || "—"),
          el("td", {}, a.SerialNumber || "—"),
          el("td", {}, el("span", { class: `badge badge-${STATUS_BADGE[a.Status] || "slate"}` }, a.Status || "Unknown")),
          el("td", {}, a.Condition || "—"),
          el("td", {}, a.CurrentLocationName || a.CurrentLocation || "—"),
          el("td", {}, a.CurrentEmployeeName || a.CurrentEmployee || "—"),
        ])
      );
    });
  }

  document.getElementById("search-input").addEventListener("input", debounce(render, 150));
  document.getElementById("filter-status").addEventListener("change", render);
  document.getElementById("filter-category").addEventListener("change", render);

  document.getElementById("scan-input").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    const match = allAssets.find((a) => a.id === value || a.QRCode === value);
    if (match) {
      goToAsset(match.id);
    } else {
      toast("Asset Not Found — Invalid QR Code / Asset ID. Asset cannot be identified.", "error");
    }
  });

  load();
</script>
</body>
</html>
