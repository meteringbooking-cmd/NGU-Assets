<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location Types · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="page-toolbar">
    <input type="search" class="search-input" id="search-input" placeholder="Search location types…" />
    <button class="btn btn-primary" id="add-btn">+ Add Location Type</button>
  </div>

  <div class="card">
    <table class="data-table">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Description</th><th>Status</th></tr>
      </thead>
      <tbody id="rows"><tr class="loading-row"><td colspan="4">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { db } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import { initLayout, el, $, toast, debounce, nextId, logAudit, fetchAll, openModal, closeModal, getActingAs, nowISO } from "./shared/common.js";
  import { doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  initLayout("location-types", "Location Types");

  let all = [];

  async function load() {
    document.getElementById("rows").innerHTML = `<tr class="loading-row"><td colspan="4">Loading…</td></tr>`;
    all = await fetchAll(COLLECTIONS.LOCATION_TYPES);
    all.sort((a, b) => (a.LocationTypeName || "").localeCompare(b.LocationTypeName || ""));
    render();
  }

  function render() {
    const tbody = document.getElementById("rows");
    const term = ($("#search-input").value || "").toLowerCase();
    tbody.innerHTML = "";
    const rows = all.filter((r) => !term || (r.LocationTypeName || "").toLowerCase().includes(term));
    if (rows.length === 0) {
      tbody.appendChild(el("tr", { class: "static-row" }, el("td", { colspan: "4", class: "empty-state" }, "No location types yet.")));
      return;
    }
    rows.forEach((r) => {
      tbody.appendChild(
        el("tr", { onclick: () => openForm(r) }, [
          el("td", {}, r.id),
          el("td", {}, r.LocationTypeName),
          el("td", {}, r.Description || "—"),
          el("td", {}, el("span", { class: `badge ${r.Active === false ? "badge-slate" : "badge-green"}` }, r.Active === false ? "Inactive" : "Active")),
        ])
      );
    });
  }

  document.getElementById("search-input").addEventListener("input", debounce(render, 150));
  document.getElementById("add-btn").addEventListener("click", () => openForm(null));

  function openForm(existing) {
    const form = el("form", { class: "field-grid single" });
    form.innerHTML = `
      <div class="field"><label>Location Type Name *</label><input name="LocationTypeName" required maxlength="100" placeholder="e.g. Region, Depot, Employee Home, Calibration Provider" /></div>
      <div class="field"><label>Description *</label><textarea name="Description" required maxlength="500"></textarea></div>
      <div class="field checkbox-row"><input type="checkbox" name="Active" id="chk-active" /><label for="chk-active">Active</label></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">${existing ? "Save Changes" : "Create"}</button>
      </div>
    `;
    if (existing) {
      form.querySelector('[name="LocationTypeName"]').value = existing.LocationTypeName || "";
      form.querySelector('[name="Description"]').value = existing.Description || "";
      form.querySelector('[name="Active"]').checked = existing.Active !== false;
    } else {
      form.querySelector('[name="Active"]').checked = true;
    }
    const panel = openModal(existing ? `Edit Location Type — ${existing.LocationTypeName}` : "Add Location Type", form);
    panel.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = {
        LocationTypeName: fd.get("LocationTypeName"),
        Description: fd.get("Description"),
        Active: form.querySelector('[name="Active"]').checked,
      };
      try {
        if (existing) {
          await updateDoc(doc(db, COLLECTIONS.LOCATION_TYPES, existing.id), data);
          await logAudit({ recordType: "LocationType", recordId: existing.id, action: "Update", description: `Updated location type ${data.LocationTypeName}` });
          toast("Location type updated", "success");
        } else {
          const id = await nextId("LT", 4);
          data.CreatedDate = nowISO();
          data.CreatedBy = getActingAs().name || "Unknown";
          await setDoc(doc(db, COLLECTIONS.LOCATION_TYPES, id), data);
          await logAudit({ recordType: "LocationType", recordId: id, action: "Create", description: `Created location type ${data.LocationTypeName}` });
          toast("Location type created", "success");
        }
        closeModal();
        load();
      } catch (err) {
        toast("Could not save: " + err.message, "error");
      }
    });
  }

  load();
</script>
</body>
</html>
