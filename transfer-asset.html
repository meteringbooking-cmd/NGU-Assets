<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transfer Asset · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad" style="max-width:760px;">
    <div class="section-title">1. Select Current Employee</div>
    <div class="field" style="max-width:380px;">
      <label>Current Employee (asset holder) *</label>
      <select id="current-employee-select"><option value="">Select an employee…</option></select>
    </div>
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="assets-card">
    <div class="section-title">2. Select Asset(s) to Transfer</div>
    <div id="asset-list"></div>
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="new-employee-card">
    <div class="section-title">3. Select New Employee</div>
    <div class="field" style="max-width:380px;">
      <label>Receiving Employee *</label>
      <select id="new-employee-select"><option value="">Select an employee…</option></select>
    </div>
    <div id="new-employee-summary" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="signature-card">
    <div class="section-title">4. Receiving Employee's Electronic Signature</div>
    <p class="muted" style="margin-top:-6px;">The new employee confirms they are accepting responsibility for the asset(s) above.</p>
    <div id="signature-host"></div>
    <div class="form-actions">
      <button class="btn btn-primary" id="complete-btn">Complete Transfer</button>
    </div>
  </div>

  <div class="card card-pad" id="result-card" style="display:none; margin-top:20px;">
    <div class="section-title">Transfer Complete</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, logAudit, getActingAs, nowISO,
    INELIGIBLE_STATUS_REASONS, findActiveAssignment, findEmployeeLocation,
    adjustEmployeeAssetCount, recordMovement, createSignaturePad,
  } from "./shared/common.js";
  import { doc, addDoc, collection, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("transfer-asset", "Transfer Asset");

  let employees = [];
  let currentEmployee = null;
  let newEmployee = null;
  let assignedAssets = [];
  let selectedAssetIds = new Set();
  let signaturePad = null;

  async function init() {
    employees = (await fetchAll(COLLECTIONS.EMPLOYEE_REGISTER)).filter(
      (e) => e.EmploymentStatus === "Active" && e.AssetEligible !== false
    );
    employees.sort((a, b) => (a.FullName || "").localeCompare(b.FullName || ""));
    const currentSelect = document.getElementById("current-employee-select");
    currentSelect.innerHTML = '<option value="">Select an employee…</option>';
    employees.forEach((e) => currentSelect.appendChild(el("option", { value: e.id }, e.FullName)));
  }

  async function selectCurrentEmployee(id, preselectAssetId) {
    currentEmployee = employees.find((emp) => emp.id === id) || null;
    document.getElementById("current-employee-select").value = currentEmployee ? currentEmployee.id : "";
    selectedAssetIds = new Set();
    document.getElementById("assets-card").style.display = "none";
    document.getElementById("new-employee-card").style.display = "none";
    document.getElementById("signature-card").style.display = "none";
    if (!currentEmployee) return;

    const allAssets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    assignedAssets = allAssets.filter((a) => a.CurrentEmployee === currentEmployee.id);
    const listHost = document.getElementById("asset-list");
    listHost.innerHTML = "";
    if (assignedAssets.length === 0) {
      listHost.appendChild(el("div", { class: "empty-state" }, `${currentEmployee.FullName} has no assets currently allocated.`));
      document.getElementById("assets-card").style.display = "";
      return;
    }
    assignedAssets.forEach((a) => {
      const eligible = a.Status === "Assigned";
      const checkboxAttrs = { type: "checkbox" };
      if (!eligible) checkboxAttrs.disabled = "disabled";
      const row = el("label", { class: "field checkbox-row", style: "padding:8px 0; border-bottom:1px solid var(--slate-100);" }, [
        el("input", checkboxAttrs),
        el("span", {}, `${a.AssetName} — ${a.id}${eligible ? "" : `  (${INELIGIBLE_STATUS_REASONS[a.Status] || a.Status})`}`),
      ]);
      const checkbox = row.querySelector("input");
      if (eligible) {
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedAssetIds.add(a.id);
          else selectedAssetIds.delete(a.id);
          refreshDownstream();
        });
        if (preselectAssetId && a.id === preselectAssetId) {
          checkbox.checked = true;
          selectedAssetIds.add(a.id);
        }
      }
      listHost.appendChild(row);
    });
    document.getElementById("assets-card").style.display = "";
    populateNewEmployeeSelect();
    refreshDownstream();
  }
  document.getElementById("current-employee-select").addEventListener("change", (e) => selectCurrentEmployee(e.target.value));

  function populateNewEmployeeSelect() {
    const select = document.getElementById("new-employee-select");
    select.innerHTML = '<option value="">Select an employee…</option>';
    employees.filter((e) => e.id !== currentEmployee.id).forEach((e) => select.appendChild(el("option", { value: e.id }, e.FullName)));
  }

  function refreshDownstream() {
    const hasSelection = selectedAssetIds.size > 0;
    document.getElementById("new-employee-card").style.display = hasSelection ? "" : "none";
    if (!hasSelection) document.getElementById("signature-card").style.display = "none";
  }

  document.getElementById("new-employee-select").addEventListener("change", (e) => {
    newEmployee = employees.find((emp) => emp.id === e.target.value) || null;
    const summary = document.getElementById("new-employee-summary");
    if (newEmployee) {
      summary.textContent = `${newEmployee.JobTitle || ""} · ${newEmployee.Department || ""} · currently holds ${newEmployee.CurrentAssetCount ?? 0} asset(s)`;
      document.getElementById("signature-card").style.display = "";
      if (!signaturePad) signaturePad = createSignaturePad(document.getElementById("signature-host"));
    } else {
      summary.textContent = "";
      document.getElementById("signature-card").style.display = "none";
    }
  });

  document.getElementById("complete-btn").addEventListener("click", async () => {
    if (!currentEmployee || !newEmployee) { toast("Select both the current and receiving employee.", "error"); return; }
    if (selectedAssetIds.size === 0) { toast("Select at least one asset to transfer.", "error"); return; }
    if (!signaturePad || signaturePad.isEmpty()) { toast("Electronic signature is required before the transfer can be completed.", "error"); return; }

    const btn = document.getElementById("complete-btn");
    btn.disabled = true;
    try {
      const blob = await signaturePad.getBlob();
      const sigRef = ref(storage, `signatures/transfer_${newEmployee.id}_${Date.now()}.png`);
      await uploadBytes(sigRef, blob);
      const signatureUrl = await getDownloadURL(sigRef);
      const signedAt = nowISO();
      const newEmployeeLocation = await findEmployeeLocation(newEmployee.id);
      const transferred = [];

      for (const assetId of selectedAssetIds) {
        const asset = assignedAssets.find((a) => a.id === assetId);

        const active = await findActiveAssignment(assetId);
        if (active) {
          await updateDoc(doc(db, COLLECTIONS.ASSIGNMENT_HISTORY, active.id), { AssignmentEndDate: signedAt });
        }

        await addDoc(collection(db, COLLECTIONS.ASSIGNMENT_HISTORY), {
          AssetID: assetId,
          EmployeeID: newEmployee.id,
          AssignmentType: "Transfer",
          AssignmentStartDate: signedAt,
          AssignmentEndDate: null,
          PreviousEmployeeID: currentEmployee.id,
          ElectronicSignature: signatureUrl,
          SignatureDateTime: signedAt,
          CompletedBy: getActingAs().name || "Unknown",
          Notes: `Transferred from ${currentEmployee.FullName} to ${newEmployee.FullName}`,
          CreatedDate: signedAt,
          CreatedBy: getActingAs().name || "Unknown",
        });

        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, assetId), {
          CurrentEmployee: newEmployee.id,
          CurrentLocation: newEmployeeLocation,
        });

        await recordMovement({
          assetId,
          action: "Transferred Between Employees",
          fromLocation: await findEmployeeLocation(currentEmployee.id),
          toLocation: newEmployeeLocation,
          notes: `Transferred from ${currentEmployee.FullName} to ${newEmployee.FullName}`,
        });

        await logAudit({
          recordType: "Asset",
          recordId: assetId,
          action: "Update",
          description: `Transferred ${asset.AssetName} (${assetId}) from ${currentEmployee.FullName} to ${newEmployee.FullName}`,
        });
        transferred.push(asset);
      }

      await adjustEmployeeAssetCount(currentEmployee.id, -transferred.length);
      await adjustEmployeeAssetCount(newEmployee.id, transferred.length);

      document.getElementById("result-card").style.display = "";
      document.getElementById("result-body").innerHTML = "";
      document.getElementById("result-body").appendChild(
        el("div", {}, [
          el("p", {}, `${transferred.length} asset(s) transferred from ${currentEmployee.FullName} to ${newEmployee.FullName}.`),
          ...transferred.map((a) => el("div", {}, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(a.id)}` }, `${a.AssetName} — ${a.id} →`))),
        ])
      );
      toast("Transfer complete", "success");

      selectedAssetIds = new Set();
      newEmployee = null;
      signaturePad.clear();
      document.getElementById("current-employee-select").value = "";
      document.getElementById("assets-card").style.display = "none";
      document.getElementById("new-employee-card").style.display = "none";
      document.getElementById("signature-card").style.display = "none";
      currentEmployee = null;
      init();
    } catch (err) {
      console.error(err);
      toast("Could not complete transfer: " + err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const employeeId = params.get("employee");
    const assetId = params.get("asset");
    if (employeeId && employees.some((e) => e.id === employeeId)) {
      await selectCurrentEmployee(employeeId, assetId || null);
    }
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
