<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Damage / Loss · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad">
    <div class="section-title">Open Incidents</div>
    <table class="data-table" id="queue-table" style="display:none;">
      <thead><tr><th>Incident ID</th><th>Asset</th><th>Type</th><th>Status</th><th>Reported</th></tr></thead>
      <tbody id="queue-rows"></tbody>
    </table>
    <div class="empty-state" id="queue-empty">No open incidents right now.</div>
  </div>

  <div class="card card-pad" style="margin-top:20px; max-width:820px;">
    <div class="section-title">Report a New Incident</div>
    <input type="text" id="scan-input" placeholder="Scan/enter Asset ID or QR Code, then press Enter" style="width:100%; max-width:500px; border:1px solid var(--steel-300); border-radius:6px; padding:9px 10px; font-size:14px;" />
  </div>

  <div id="asset-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Asset</div>
    <div id="asset-summary" class="muted"></div>
  </div>

  <div id="type-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Incident Type</div>
    <p class="muted" style="margin-bottom:14px;">The incident type must be selected before the incident can proceed.</p>
    <div class="pill-toggle" id="type-toggle" style="flex-wrap:wrap;">
      <button type="button" data-type="Damaged">Damaged</button>
      <button type="button" data-type="Missing">Missing</button>
      <button type="button" data-type="Stolen">Stolen</button>
      <button type="button" data-type="Lost in Transit">Lost in Transit</button>
    </div>
  </div>

  <div id="form-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title" id="form-title">Incident Details</div>
    <div id="form-host"></div>
  </div>

  <div id="detail-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Incident</div>
    <div id="detail-summary" class="muted" style="margin-bottom:14px;"></div>
    <div id="stage-host"></div>
  </div>

  <div id="result-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Done</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, requirePin, nowISO, todayISO, nextId,
    findAllOpenIncidents, findOpenIncident, recordMovement, INELIGIBLE_STATUS_REASONS,
  } from "./shared/common.js";
  import { doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("incidents", "Report Damage / Loss");

  // Statuses that already mean "there's an unresolved incident of some kind
  // in progress" — a new incident can't be raised on top of these.
  const BLOCKED_STATUSES = ["Missing", "Stolen", "Lost in Transit", "Retired"];

  let suppliers = [];
  let assetsById = {};
  let asset = null;
  let incident = null; // the in-progress/open incident being worked on

  async function init() {
    suppliers = await fetchAll(COLLECTIONS.SUPPLIER_REGISTER);
    const allAssets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    assetsById = {};
    allAssets.forEach((a) => (assetsById[a.id] = a));
    await loadQueue();
  }

  async function loadQueue() {
    const open = await findAllOpenIncidents();
    const table = document.getElementById("queue-table");
    const empty = document.getElementById("queue-empty");
    const rows = document.getElementById("queue-rows");
    rows.innerHTML = "";
    if (open.length === 0) {
      table.style.display = "none";
      empty.style.display = "";
      return;
    }
    table.style.display = "";
    empty.style.display = "none";
    open.forEach((r) => {
      const a = assetsById[r.AssetID];
      rows.appendChild(
        el("tr", { onclick: () => loadIncident(r.id) }, [
          el("td", {}, r.id),
          el("td", {}, a ? `${a.AssetName} — ${a.id}` : r.AssetID),
          el("td", {}, r.IncidentType || ""),
          el("td", {}, el("span", { class: "badge badge-amber" }, r.IncidentStatus || "Open")),
          el("td", {}, (r.IncidentDate || r.CreatedDate || "").slice(0, 10)),
        ])
      );
    });
  }

  /* ---------------- Step 1: scan asset ---------------- */
  async function findAssetByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (direct) return direct;
    const all = Object.values(assetsById);
    return all.find((a) => a.QRCode === value) || null;
  }

  function clearAssetState() {
    document.getElementById("asset-card").style.display = "none";
    document.getElementById("type-card").style.display = "none";
    document.getElementById("form-card").style.display = "none";
    asset = null;
  }

  function resetAll() {
    clearAssetState();
    document.getElementById("detail-card").style.display = "none";
    document.getElementById("result-card").style.display = "none";
    incident = null;
  }

  async function loadAsset(value) {
    const a = await findAssetByIdentifier(value);
    if (!a) {
      toast('Asset Not Found — "Invalid QR Code. Asset cannot be Identified."', "error");
      return;
    }
    if (a.StockItem) {
      toast("Stock items are tracked by quantity, not individually — incidents can't be reported against them here.", "error");
      return;
    }
    resetAll();
    asset = a;
    document.getElementById("scan-input").value = "";
    document.getElementById("asset-card").style.display = "";
    document.getElementById("asset-summary").innerHTML = "";
    document.getElementById("asset-summary").appendChild(
      el("p", {}, `${a.AssetName} (${a.id}) — ${a.Category || ""} · Status: ${a.Status || "Unknown"}`)
    );

    const existingOpen = await findOpenIncident(a.id);
    if (existingOpen) {
      toast(`This asset already has an open incident (${existingOpen.id}) — opening it instead.`, "info");
      await loadIncident(existingOpen);
      return;
    }

    if (BLOCKED_STATUSES.includes(a.Status)) {
      toast(
        `Asset Not Eligible for Incident Reporting — ${INELIGIBLE_STATUS_REASONS[a.Status] || `status is ${a.Status}`}.`,
        "error"
      );
      return;
    }

    document.getElementById("type-card").style.display = "";
  }

  document.getElementById("scan-input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    await loadAsset(value);
  });

  document.getElementById("type-toggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn) return;
    document.querySelectorAll("#type-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    renderTypeForm(btn.dataset.type);
  });

  /* ---------------- Step 2: type-specific report form ---------------- */
  function renderTypeForm(type) {
    document.getElementById("form-card").style.display = "";
    document.getElementById("form-title").textContent = `${type} — Report Details`;
    const host = document.getElementById("form-host");
    host.innerHTML = "";
    if (type === "Damaged") host.appendChild(renderDamagedForm());
    else if (type === "Missing") host.appendChild(renderMissingForm());
    else if (type === "Stolen") host.appendChild(renderStolenForm());
    else if (type === "Lost in Transit") host.appendChild(renderTransitForm());
  }

  function locationSelect(name, required) {
    // Location Register isn't loaded on this page yet — free text is
    // acceptable here since "Last Known Location" is often a narrative
    // (e.g. "van, en route to Site B") rather than a fixed location code.
    return el("input", { type: "text", name, placeholder: "e.g. Stores cage, Van 3, Client site…", ...(required ? { required: "required" } : {}) });
  }

  async function createIncident(patch) {
    const actorName = getActingAs().name || "Unknown";
    const now = nowISO();
    const id = await nextId("INC", 4);
    const base = {
      AssetID: asset.id,
      IncidentType: patch.IncidentType,
      IncidentStatus: patch.IncidentStatus || "Open",
      IncidentDate: now,
      ReportedBy: actorName,
      AssignedEmployee: asset.CurrentEmployee || null,
      IncidentDescription: patch.IncidentDescription || null,
      LastKnownLocation: patch.LastKnownLocation || null,
      DispatchInformation: patch.DispatchInformation || null,
      CourierTransportProvidor: patch.CourierTransportProvidor || null,
      SupportingEvidence: patch.SupportingEvidence || null,
      PoliceReportMade: patch.PoliceReportMade || false,
      PoliceReference: patch.PoliceReference || null,
      ManagementNotified: patch.ManagementNotified || false,
      InvestigationStarted: patch.InvestigationStarted || false,
      InvestigationNotes: patch.InvestigationNotes || null,
      InsuranceClaimID: null,
      ReplacementRequestID: null,
      IncidentOutcome: patch.IncidentOutcome || null,
      ResolutionDate: patch.ResolutionDate || null,
      ResolutionNotes: patch.ResolutionNotes || null,
      ManagerDecision: patch.ManagerDecision || null,
      DecisionDate: null,
      DecisionNotes: null,
      CreatedDate: now,
      CreatedBy: actorName,
      LastUpdatedDate: now,
      LastUpdatedBy: actorName,
    };
    await setDoc(doc(db, COLLECTIONS.ASSET_INCIDENT, id), base);
    return { id, ...base };
  }

  async function uploadEvidence(file, folder) {
    if (!file || file.size === 0) return null;
    const fref = ref(storage, `${folder}/${asset.id}/${Date.now()}_${file.name}`);
    await uploadBytes(fref, file);
    return await getDownloadURL(fref);
  }

  function showIncidentCreated(node) {
    document.getElementById("asset-card").style.display = "none";
    document.getElementById("type-card").style.display = "none";
    document.getElementById("form-card").style.display = "none";
    document.getElementById("result-card").style.display = "";
    const body = document.getElementById("result-body");
    body.innerHTML = "";
    body.appendChild(node);
    body.appendChild(
      el("div", { style: "margin-top:10px;" }, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(asset.id)}` }, "Open asset record →"))
    );
    asset = null;
    loadQueue();
  }

  /* ---- Damaged: one-shot report — repair-required routes to Repair Asset ---- */
  function renderDamagedForm() {
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [el("label", {}, "Describe the damage *"), el("textarea", { name: "IncidentDescription", required: "required" })]),
      el("div", { class: "field span-2" }, [el("label", {}, "Supporting Photos"), el("input", { type: "file", name: "SupportingEvidence", accept: "image/*,.pdf" })]),
      el("div", { class: "field span-2" }, [
        el("label", {}, "Does this damage require repair? *"),
        el("div", { class: "pill-toggle", id: "repair-toggle" }, [
          el("button", { type: "button", "data-val": "yes" }, "Yes — needs repair"),
          el("button", { type: "button", class: "active", "data-val": "no" }, "No — still fit for service"),
        ]),
      ]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Record Damage")]),
    ]);
    let repairNeeded = false;
    form.querySelector("#repair-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-val]");
      if (!btn) return;
      repairNeeded = btn.dataset.val === "yes";
      form.querySelectorAll("#repair-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const description = fd.get("IncidentDescription");
      if (!description) return toast("Please describe the damage.", "error");
      if (!(await requirePin("Report Damaged Incident"))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const evidenceUrl = await uploadEvidence(fd.get("SupportingEvidence"), "incident-evidence");
        const now = nowISO();
        const rec = await createIncident({
          IncidentType: "Damaged",
          IncidentStatus: "Closed",
          IncidentDescription: description,
          SupportingEvidence: evidenceUrl,
          IncidentOutcome: repairNeeded ? "Repair Required" : "No Repair Required",
          ResolutionDate: now,
          ResolutionNotes: repairNeeded ? "Damaged asset routed to the Repair Asset process." : "Assessed as fit for service — no repair required.",
        });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Damage reported for ${asset.AssetName} (${asset.id}) — ${rec.IncidentOutcome}` });

        if (repairNeeded) {
          await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Under Repair" });
          const repairId = await nextId("REP", 4);
          const actorName = getActingAs().name || "Unknown";
          await setDoc(doc(db, COLLECTIONS.REPAIR_REGISTER, repairId), {
            AssetID: asset.id,
            IncidentID: rec.id,
            RepairStatus: "Awaiting Manager Approval",
            RepairType: null,
            RepairProvidor: null,
            RepairQuotation: null,
            EstimatedRepairCost: null,
            ReplacementCost: asset.ReplacementCost || null,
            RepairCostPercentage: null,
            RepairRecommendation: null,
            RecommendationReason: null,
            ManagerDecision: "Awaiting Decision",
            RepairDate: null,
            RepairCost: null,
            RepairNotes: description,
            CompletionDate: null,
            BeyondRepair: false,
            CreatedDate: now,
            CreatedBy: actorName,
          });
          await recordMovement({ assetId: asset.id, action: "Damage Reported", notes: `Incident ${rec.id} — routed to Repair (${repairId})` });
          showIncidentCreated(
            el("div", {}, [
              el("p", {}, `Damage recorded for ${asset.AssetName} (${asset.id}). The asset is now Under Repair.`),
              el("p", { class: "muted" }, `Repair job ${repairId} created — continue it from the Repair queue.`),
            ])
          );
        } else {
          await recordMovement({ assetId: asset.id, action: "Damage Reported", notes: `Incident ${rec.id} — no repair required` });
          showIncidentCreated(el("p", {}, `Damage recorded for ${asset.AssetName} (${asset.id}) — no repair required, incident closed.`));
        }
      } catch (err) {
        console.error(err);
        toast("Could not record damage: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return form;
  }

  /* ---- Missing: opens an investigation, stays "Missing" until resolved ---- */
  function renderMissingForm() {
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [el("label", {}, "Last known location *"), locationSelect("LastKnownLocation", true)]),
      el("div", { class: "field span-2" }, [el("label", {}, "Reason the asset is missing (where known)"), el("textarea", { name: "IncidentDescription" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Report Missing")]),
    ]);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const location = fd.get("LastKnownLocation");
      if (!location) return toast("Last known location is required.", "error");
      if (!(await requirePin("Report Missing Incident"))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const rec = await createIncident({
          IncidentType: "Missing",
          IncidentStatus: "Open",
          LastKnownLocation: location,
          IncidentDescription: fd.get("IncidentDescription") || null,
          InvestigationStarted: true,
        });
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Missing" });
        await recordMovement({ assetId: asset.id, action: "Reported Missing", notes: `Incident ${rec.id} — last known: ${location}` });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) reported Missing — incident ${rec.id}` });
        incident = rec;
        showIncidentCreated(el("p", {}, `${asset.AssetName} (${asset.id}) is now recorded as Missing. The investigation stays open in the queue above until it's resolved.`));
      } catch (err) {
        console.error(err);
        toast("Could not report asset missing: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return form;
  }

  /* ---- Stolen: theft report, requires manager approval before Status = Stolen ---- */
  function renderStolenForm() {
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [el("label", {}, "Describe the theft *"), el("textarea", { name: "IncidentDescription", required: "required" })]),
      el("div", { class: "field span-2" }, [el("label", {}, "Last known location *"), locationSelect("LastKnownLocation", true)]),
      el("div", { class: "field span-2" }, [el("label", {}, "Witness details (optional)"), el("textarea", { name: "WitnessDetails" })]),
      el("div", { class: "field span-2" }, [el("label", {}, "Photographs (optional)"), el("input", { type: "file", name: "SupportingEvidence", accept: "image/*,.pdf" })]),
      el("div", { class: "field" }, [
        el("label", {}, "Police report made? *"),
        el("div", { class: "pill-toggle", id: "police-toggle" }, [
          el("button", { type: "button", "data-val": "yes" }, "Yes"),
          el("button", { type: "button", class: "active", "data-val": "no" }, "No"),
        ]),
      ]),
      el("div", { class: "field" }, [el("label", {}, "Crime reference number"), el("input", { type: "text", name: "PoliceReference", placeholder: "Required if a police report was made" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Submit Theft Report")]),
    ]);
    let policeReportMade = false;
    form.querySelector("#police-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-val]");
      if (!btn) return;
      policeReportMade = btn.dataset.val === "yes";
      form.querySelectorAll("#police-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const description = fd.get("IncidentDescription");
      const location = fd.get("LastKnownLocation");
      const reference = fd.get("PoliceReference");
      if (!description) return toast("Please describe the theft.", "error");
      if (!location) return toast("Last known location is required.", "error");
      if (policeReportMade && !reference) return toast("Crime reference number must be recorded when a police report has been made.", "error");
      if (!(await requirePin("Report Stolen Incident"))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const evidenceUrl = await uploadEvidence(fd.get("SupportingEvidence"), "incident-evidence");
        const rec = await createIncident({
          IncidentType: "Stolen",
          IncidentStatus: "Awaiting Manager Approval",
          IncidentDescription: `${description}${fd.get("WitnessDetails") ? `\n\nWitness details: ${fd.get("WitnessDetails")}` : ""}`,
          LastKnownLocation: location,
          SupportingEvidence: evidenceUrl,
          PoliceReportMade: policeReportMade,
          PoliceReference: policeReportMade ? reference : null,
          ManagerDecision: "Awaiting Decision",
        });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Theft reported for ${asset.AssetName} (${asset.id}) — awaiting manager approval` });
        incident = rec;
        showIncidentCreated(el("p", {}, `Theft report submitted for ${asset.AssetName} (${asset.id}) — awaiting manager approval before the asset is marked Stolen.`));
      } catch (err) {
        console.error(err);
        toast("Could not submit theft report: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return form;
  }

  /* ---- Lost in Transit: dispatched to/from a provider, tracking ---- */
  function renderTransitForm() {
    const providerSelect = el("select", { name: "CourierTransportProvidor", required: "required" }, [el("option", { value: "" }, "Select…")]);
    suppliers.filter((s) => s.Active !== false).forEach((s) => providerSelect.appendChild(el("option", { value: s.id }, s.TradingName || s.SupplierName)));

    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [el("label", {}, "Dispatch information *"), el("textarea", { name: "DispatchInformation", required: "required", placeholder: "e.g. Dispatched to Martindale Ltd on 18/08/2026" })]),
      el("div", { class: "field" }, [el("label", {}, "Courier / transport provider *"), providerSelect]),
      el("div", { class: "field" }, [el("label", {}, "Last known location *"), locationSelect("LastKnownLocation", true)]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Report Lost in Transit")]),
    ]);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const dispatch = fd.get("DispatchInformation");
      const provider = fd.get("CourierTransportProvidor");
      const location = fd.get("LastKnownLocation");
      if (!dispatch) return toast("Dispatch information must be recorded.", "error");
      if (!provider) return toast("Courier / transport provider must be recorded.", "error");
      if (!location) return toast("Last known location is required.", "error");
      if (!(await requirePin("Report Lost in Transit Incident"))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const rec = await createIncident({
          IncidentType: "Lost in Transit",
          IncidentStatus: "Open",
          DispatchInformation: dispatch,
          CourierTransportProvidor: provider,
          LastKnownLocation: location,
          InvestigationStarted: true,
        });
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Lost in Transit" });
        await recordMovement({ assetId: asset.id, action: "Reported Lost in Transit", notes: `Incident ${rec.id}` });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) reported Lost in Transit — incident ${rec.id}` });
        incident = rec;
        showIncidentCreated(el("p", {}, `${asset.AssetName} (${asset.id}) is now recorded as Lost in Transit. A courier investigation should be initiated — continue it from the queue above.`));
      } catch (err) {
        console.error(err);
        toast("Could not report asset lost in transit: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return form;
  }

  /* ---------------- Working an existing open incident ---------------- */
  async function findIncidentByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.ASSET_INCIDENT, value);
    if (direct) return direct;
    let a = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (!a) a = Object.values(assetsById).find((x) => x.QRCode === value) || null;
    if (!a) return null;
    return await findOpenIncident(a.id);
  }

  async function loadIncident(value) {
    const rec = typeof value === "object" ? value : await findIncidentByIdentifier(value);
    if (!rec) {
      toast("No open incident found for that reference.", "error");
      return;
    }
    resetAll();
    incident = rec;
    asset = (await fetchOne(COLLECTIONS.ASSET_REGISTER, rec.AssetID)) || assetsById[rec.AssetID];
    document.getElementById("scan-input").value = "";
    document.getElementById("result-card").style.display = "none";
    renderIncidentStage();
  }

  async function saveIncident(patch) {
    const actorName = getActingAs().name || "Unknown";
    patch.LastUpdatedDate = nowISO();
    patch.LastUpdatedBy = actorName;
    await updateDoc(doc(db, COLLECTIONS.ASSET_INCIDENT, incident.id), patch);
    Object.assign(incident, patch);
  }

  function renderIncidentStage() {
    document.getElementById("detail-card").style.display = "";
    document.getElementById("detail-summary").innerHTML = "";
    document.getElementById("detail-summary").appendChild(
      el("p", {}, `${asset.AssetName} (${asset.id}) — Incident ${incident.id} · ${incident.IncidentType}`)
    );
    const host = document.getElementById("stage-host");
    host.innerHTML = "";

    if (incident.IncidentType === "Stolen" && incident.IncidentStatus === "Awaiting Manager Approval") {
      host.appendChild(renderStolenReviewStage());
    } else if (incident.IncidentType === "Stolen" && !incident.IncidentOutcome) {
      host.appendChild(renderRecoveryOutcomeStage());
    } else if (incident.IncidentType === "Missing" && !incident.IncidentOutcome) {
      host.appendChild(renderRecoveryOutcomeStage());
    } else if (incident.IncidentType === "Lost in Transit" && incident.AssetLocated === undefined) {
      host.appendChild(renderTransitTrackingStage());
    } else if (incident.IncidentType === "Lost in Transit" && incident.AssetLocated === false && !incident.IncidentOutcome) {
      host.appendChild(renderTransitLostStage());
    } else {
      host.appendChild(el("div", { class: "empty-state" }, "This incident has already been closed."));
    }
  }

  function renderStolenReviewStage() {
    const wrap = el("div", {}, [
      el("div", { class: "card-pad", style: "background:var(--steel-50); border-radius:6px; margin-bottom:16px; padding:14px;" }, [
        el("p", {}, el("strong", {}, "Theft report awaiting manager approval.")),
        el("p", { class: "muted" }, incident.IncidentDescription || ""),
      ]),
    ]);
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [
        el("label", {}, "Manager Decision *"),
        el("div", { class: "pill-toggle", id: "theft-decision-toggle" }, [
          el("button", { type: "button", class: "active", "data-decision": "Approved" }, "Approved — Confirm Theft"),
          el("button", { type: "button", "data-decision": "Declined" }, "Declined"),
        ]),
      ]),
      el("div", { class: "field span-2" }, [el("label", {}, "Decision Notes"), el("textarea", { name: "DecisionNotes" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Record Decision")]),
    ]);
    wrap.appendChild(form);

    let decision = "Approved";
    form.querySelector("#theft-decision-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-decision]");
      if (!btn) return;
      decision = btn.dataset.decision;
      form.querySelectorAll("#theft-decision-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      if (!(await requirePin(decision === "Approved" ? "Approve Stolen Report" : "Decline Stolen Report"))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const now = nowISO();
        if (decision === "Approved") {
          await saveIncident({ ManagerDecision: "Approved", DecisionDate: todayISO(), DecisionNotes: fd.get("DecisionNotes") || null, IncidentStatus: "Open" });
          await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Stolen" });
          await recordMovement({ assetId: asset.id, action: "Theft Confirmed", notes: `Incident ${incident.id}` });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) confirmed Stolen — incident ${incident.id}` });
          toast("Theft confirmed — asset marked Stolen.", "success");
        } else {
          await saveIncident({
            ManagerDecision: "Declined",
            DecisionDate: todayISO(),
            DecisionNotes: fd.get("DecisionNotes") || null,
            IncidentStatus: "Closed",
            IncidentOutcome: "Theft Not Confirmed",
            ResolutionDate: now,
            ResolutionNotes: fd.get("DecisionNotes") || "Theft report declined on manager review.",
          });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Theft report declined for ${asset.AssetName} (${asset.id}) — incident ${incident.id}` });
          toast("Theft report declined — incident closed, asset status unchanged.", "info");
        }
        renderIncidentStage();
      } catch (err) {
        console.error(err);
        toast("Could not record decision: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return wrap;
  }

  /* Shared "was it recovered?" tail for Missing + confirmed Stolen incidents. */
  function renderRecoveryOutcomeStage() {
    const wrap = el("div", {});
    wrap.appendChild(el("div", { class: "form-section-heading" }, "Investigation Outcome"));
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [
        el("label", {}, "Outcome *"),
        el("div", { class: "pill-toggle", id: "outcome-toggle" }, [
          el("button", { type: "button", class: "active", "data-val": "Asset Recovered" }, "Asset Recovered"),
          el("button", { type: "button", "data-val": "Not Recovered" }, incident.IncidentType === "Stolen" ? "Written Off" : "Not Recovered"),
        ]),
      ]),
      el("div", { class: "field span-2" }, [el("label", {}, "Notes *"), el("textarea", { name: "ResolutionNotes", required: "required" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Record Outcome")]),
    ]);
    wrap.appendChild(form);

    let outcomeVal = "Asset Recovered";
    form.querySelector("#outcome-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-val]");
      if (!btn) return;
      outcomeVal = btn.dataset.val;
      form.querySelectorAll("#outcome-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const notes = fd.get("ResolutionNotes");
      if (!notes) return toast("Notes are required.", "error");
      const recovered = outcomeVal === "Asset Recovered";
      if (!(await requirePin(recovered ? "Mark Asset Recovered" : (incident.IncidentType === "Stolen" ? "Mark Asset Written Off" : "Mark Asset Not Recovered")))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const now = nowISO();
        await saveIncident({
          IncidentOutcome: recovered ? "Asset Recovered" : outcomeVal,
          ResolutionDate: now,
          ResolutionNotes: notes,
          IncidentStatus: "Closed",
        });
        if (recovered) {
          await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Awaiting Inspection" });
          await recordMovement({ assetId: asset.id, action: `${incident.IncidentType} — Recovered`, notes: `Incident ${incident.id}` });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) recovered — incident ${incident.id} closed`, ...(asset.CurrentEmployee ? { employeeIds: [asset.CurrentEmployee] } : {}) });
          finishIncident(
            el("div", {}, [
              el("p", {}, `${asset.AssetName} (${asset.id}) has been recovered.`),
              el("p", { class: "muted" }, `It must be inspected before it can return to service.`),
              asset.CurrentEmployee
                ? el("p", {}, el("a", { class: "text-link", href: `return-asset.html?employee=${encodeURIComponent(asset.CurrentEmployee)}&asset=${encodeURIComponent(asset.id)}` }, "Inspect this asset →"))
                : el("p", {}, el("a", { class: "text-link", href: "return-asset.html" }, "Inspect this asset →")),
            ])
          );
        } else {
          await recordMovement({ assetId: asset.id, action: `${incident.IncidentType} — ${outcomeVal}`, notes: `Incident ${incident.id}` });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) — ${outcomeVal}, incident ${incident.id} closed` });
          finishIncident(
            el("div", {}, [
              el("p", {}, `${asset.AssetName} (${asset.id}) recorded as ${outcomeVal}. Incident closed.`),
              el("p", { class: "muted" }, `A recharge may be raised from the Recharge module if applicable.`),
              el("p", {}, el("a", { class: "text-link", href: `recharge.html?asset=${encodeURIComponent(asset.id)}&incident=${encodeURIComponent(incident.id)}` }, "Start a recharge case →")),
            ])
          );
        }
      } catch (err) {
        console.error(err);
        toast("Could not record outcome: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return wrap;
  }

  function renderTransitTrackingStage() {
    const wrap = el("div", {}, [
      el("p", { class: "muted", style: "margin-bottom:14px;" }, `Dispatched via ${suppliers.find((s) => s.id === incident.CourierTransportProvidor)?.TradingName || "the recorded provider"}. ${incident.DispatchInformation || ""}`),
      el("div", { class: "form-section-heading" }, "Has the asset been located?"),
    ]);
    const toggle = el("div", { class: "pill-toggle" }, [
      el("button", { type: "button", onclick: () => handleLocated(true) }, "Yes — located"),
      el("button", { type: "button", onclick: () => handleLocated(false) }, "No — declare lost"),
    ]);
    wrap.appendChild(toggle);
    return wrap;
  }

  async function handleLocated(located) {
    if (!(await requirePin(located ? "Asset Located" : "Report Asset Not Located"))) return;
    try {
      if (located) {
        await saveIncident({
          AssetLocated: true,
          IncidentOutcome: "Asset Recovered",
          IncidentStatus: "Closed",
          ResolutionDate: nowISO(),
          ResolutionNotes: "Located by courier tracking.",
        });
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Awaiting Inspection" });
        await recordMovement({ assetId: asset.id, action: "Lost in Transit — Located", notes: `Incident ${incident.id}` });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) located — incident ${incident.id} closed`, ...(asset.CurrentEmployee ? { employeeIds: [asset.CurrentEmployee] } : {}) });
        finishIncident(
          el("div", {}, [
            el("p", {}, `${asset.AssetName} (${asset.id}) has been located and must be inspected before returning to service.`),
            asset.CurrentEmployee
              ? el("p", {}, el("a", { class: "text-link", href: `return-asset.html?employee=${encodeURIComponent(asset.CurrentEmployee)}&asset=${encodeURIComponent(asset.id)}` }, "Inspect this asset →"))
              : el("p", {}, el("a", { class: "text-link", href: "return-asset.html" }, "Inspect this asset →")),
          ])
        );
      } else {
        await saveIncident({ AssetLocated: false });
        renderIncidentStage();
      }
    } catch (err) {
      console.error(err);
      toast("Could not record tracking outcome: " + err.message, "error");
    }
  }

  function renderTransitLostStage() {
    const wrap = el("div", {});
    wrap.appendChild(el("div", { class: "form-section-heading" }, "Declare Asset as Lost"));
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field" }, [
        el("label", {}, "Insurance claim required?"),
        el("div", { class: "pill-toggle", id: "ins-toggle" }, [
          el("button", { type: "button", "data-val": "yes" }, "Yes"),
          el("button", { type: "button", class: "active", "data-val": "no" }, "No"),
        ]),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, "Replacement request required?"),
        el("div", { class: "pill-toggle", id: "repl-toggle" }, [
          el("button", { type: "button", "data-val": "yes" }, "Yes"),
          el("button", { type: "button", class: "active", "data-val": "no" }, "No"),
        ]),
      ]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Confirm Lost & Close")]),
    ]);
    let insuranceNeeded = false;
    let replacementNeeded = false;
    form.querySelector("#ins-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-val]");
      if (!btn) return;
      insuranceNeeded = btn.dataset.val === "yes";
      form.querySelectorAll("#ins-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });
    form.querySelector("#repl-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-val]");
      if (!btn) return;
      replacementNeeded = btn.dataset.val === "yes";
      form.querySelectorAll("#repl-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!(await requirePin("Asset Not Located — File Insurance/Replacement"))) return;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await saveIncident({
          IncidentOutcome: "Lost — Not Recovered",
          IncidentStatus: "Closed",
          ResolutionDate: nowISO(),
          ResolutionNotes: `Declared lost. Insurance claim ${insuranceNeeded ? "required" : "not required"}; replacement request ${replacementNeeded ? "required" : "not required"}.`,
          ManagementNotified: true,
        });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) declared Lost in Transit — incident ${incident.id} closed` });
        const notes = [];
        if (insuranceNeeded) notes.push("An insurance claim should be initiated separately.");
        if (replacementNeeded) notes.push("A replacement asset request should be raised separately.");
        finishIncident(
          el("div", {}, [
            el("p", {}, `${asset.AssetName} (${asset.id}) declared lost. The asset remains Lost in Transit on record.`),
            notes.length ? el("p", { class: "muted" }, notes.join(" ")) : null,
          ])
        );
      } catch (err) {
        console.error(err);
        toast("Could not close incident: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return form;
  }

  function finishIncident(node) {
    document.getElementById("detail-card").style.display = "none";
    const card = document.getElementById("result-card");
    const body = document.getElementById("result-body");
    body.innerHTML = "";
    body.appendChild(node);
    body.appendChild(el("div", { style: "margin-top:10px;" }, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(asset.id)}` }, "Open asset record →")));
    card.style.display = "";
    incident = null;
    asset = null;
    loadQueue();
  }

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const assetParam = params.get("asset");
    if (assetParam) await loadAsset(assetParam);
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
