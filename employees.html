<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Employee Register · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="page-toolbar">
    <input type="search" class="search-input" id="search-input" placeholder="Search by name, payroll number, email…" />
    <div style="display:flex; gap:10px; align-items:center;">
      <label class="field checkbox-row" style="margin:0;">
        <input type="checkbox" id="show-leavers" />
        <span>Show leavers / inactive</span>
      </label>
      <button class="btn btn-primary" id="add-employee-btn">+ Add Employee</button>
    </div>
  </div>

  <div class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Job Title</th>
          <th>Department</th>
          <th>Status</th>
          <th>Assets</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="employee-rows">
        <tr class="loading-row"><td colspan="7">Loading employees…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { db } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, $, $$, toast, debounce, nextId, logAudit, fetchAll,
    openModal, closeModal, getActingAs, nowISO,
  } from "./shared/common.js";
  import {
    doc, setDoc, updateDoc,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  initLayout("employees", "Employee Register");

  const EMPLOYEE_TYPES = ["Permanent", "Fixed Term", "Contractor", "Agency", "Apprentice"];
  const EMPLOYMENT_STATUSES = ["Active", "Leaver", "Suspended"];

  let allEmployees = [];

  async function loadEmployees() {
    const tbody = document.getElementById("employee-rows");
    tbody.innerHTML = `<tr class="loading-row"><td colspan="7">Loading employees…</td></tr>`;
    allEmployees = await fetchAll(COLLECTIONS.EMPLOYEE_REGISTER);
    allEmployees.sort((a, b) => (a.FullName || "").localeCompare(b.FullName || ""));
    renderRows();
  }

  function statusBadge(status) {
    const map = { Active: "green", Leaver: "slate", Suspended: "amber" };
    return el("span", { class: `badge badge-${map[status] || "slate"}` }, status || "—");
  }

  function renderRows() {
    const tbody = document.getElementById("employee-rows");
    const term = ($("#search-input").value || "").toLowerCase();
    const showLeavers = $("#show-leavers").checked;
    tbody.innerHTML = "";

    const rows = allEmployees.filter((e) => {
      if (!showLeavers && e.EmploymentStatus && e.EmploymentStatus !== "Active") return false;
      if (!term) return true;
      const haystack = [e.FullName, e.PayrollNumber, e.EmailAddress, e.JobTitle, e.Department]
        .join(" ")
        .toLowerCase();
      return haystack.includes(term);
    });

    if (rows.length === 0) {
      tbody.appendChild(el("tr", { class: "static-row" }, el("td", { colspan: "7", class: "empty-state" }, "No employees found.")));
      return;
    }

    rows.forEach((e) => {
      const tr = el("tr", { onclick: () => openEmployeeForm(e) }, [
        el("td", {}, e.id),
        el("td", {}, e.FullName || `${e.FirstName || ""} ${e.LastName || ""}`),
        el("td", {}, e.JobTitle || "—"),
        el("td", {}, e.Department || "—"),
        el("td", {}, statusBadge(e.EmploymentStatus)),
        el("td", {}, String(e.CurrentAssetCount ?? 0)),
        el("td", {}, e.EmailAddress || "—"),
      ]);
      tbody.appendChild(tr);
    });
  }

  document.getElementById("search-input").addEventListener("input", debounce(renderRows, 150));
  document.getElementById("show-leavers").addEventListener("change", renderRows);
  document.getElementById("add-employee-btn").addEventListener("click", () => openEmployeeForm(null));

  async function openEmployeeForm(existing) {
    const otherEmployees = allEmployees.filter((e) => e.id !== existing?.id);

    const form = el("form", { class: "field-grid" });
    form.innerHTML = `
      <div class="form-section-heading">Employee Information</div>
      <div class="field"><label>Payroll Number *</label><input name="PayrollNumber" required /></div>
      <div class="field"><label>First Name *</label><input name="FirstName" required maxlength="50" /></div>
      <div class="field"><label>Last Name *</label><input name="LastName" required maxlength="50" /></div>
      <div class="field"><label>Email Address *</label><input type="email" name="EmailAddress" required /></div>
      <div class="field"><label>Mobile Number *</label><input name="MobileNumber" required placeholder="07…" /></div>

      <div class="form-section-heading">Employment Details</div>
      <div class="field"><label>Job Title *</label><input name="JobTitle" required /></div>
      <div class="field"><label>Department *</label><input name="Department" required /></div>
      <div class="field">
        <label>Employee Type *</label>
        <select name="EmployeeType" required>${EMPLOYEE_TYPES.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
      </div>
      <div class="field">
        <label>Line Manager</label>
        <select name="LineManager">
          <option value="">None</option>
          ${otherEmployees.map((e) => `<option value="${e.id}">${e.FullName}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Start Date *</label><input type="date" name="StartDate" required /></div>

      <div class="form-section-heading">Employment Status</div>
      <div class="field">
        <label>Employment Status *</label>
        <select name="EmploymentStatus" required>${EMPLOYMENT_STATUSES.map((s) => `<option value="${s}">${s}</option>`).join("")}</select>
      </div>
      <div class="field" id="end-date-field" hidden>
        <label>End Date *</label>
        <input type="date" name="EndDate" />
      </div>

      <div class="form-section-heading">Asset Management</div>
      <div class="field checkbox-row"><input type="checkbox" name="AssetEligible" id="chk-asset-eligible" /><label for="chk-asset-eligible">Asset Eligible</label></div>
      <div class="field checkbox-row"><input type="checkbox" name="PayrollDeductionEligible" id="chk-payroll-eligible" /><label for="chk-payroll-eligible">Payroll Deduction Eligible</label></div>

      <div class="form-actions" style="grid-column: 1/-1;">
        ${existing ? '<button type="button" class="btn btn-secondary" id="deactivate-btn">Mark as Leaver</button>' : ""}
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">${existing ? "Save Changes" : "Create Employee"}</button>
      </div>
    `;

    const statusSelect = form.querySelector('[name="EmploymentStatus"]');
    const endDateField = form.querySelector("#end-date-field");
    const endDateInput = form.querySelector('[name="EndDate"]');
    function refreshEndDateVisibility() {
      const isLeaver = statusSelect.value === "Leaver";
      endDateField.hidden = !isLeaver;
      endDateInput.required = isLeaver;
      if (!isLeaver) endDateInput.value = "";
    }
    statusSelect.addEventListener("change", refreshEndDateVisibility);

    if (existing) {
      Object.entries(existing).forEach(([k, v]) => {
        const input = form.querySelector(`[name="${k}"]`);
        if (!input) return;
        if (input.type === "checkbox") input.checked = !!v;
        else input.value = v ?? "";
      });
      refreshEndDateVisibility();
    } else {
      form.querySelector('[name="AssetEligible"]').checked = true;
      form.querySelector('[name="PayrollDeductionEligible"]').checked = true;
      form.querySelector('[name="EmploymentStatus"]').value = "Active";
      refreshEndDateVisibility();
    }

    const panel = openModal(existing ? `Edit Employee — ${existing.FullName}` : "Add Employee", form, { wide: true });
    panel.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));

    const deactivateBtn = form.querySelector("#deactivate-btn");
    if (deactivateBtn) {
      deactivateBtn.addEventListener("click", async () => {
        await updateDoc(doc(db, COLLECTIONS.EMPLOYEE_REGISTER, existing.id), {
          EmploymentStatus: "Leaver",
          EndDate: existing.EndDate || new Date().toISOString().slice(0, 10),
        });
        await logAudit({ recordType: "Employee", recordId: existing.id, action: "Update", description: `${existing.FullName} marked as Leaver` });
        toast("Employee marked as Leaver", "success");
        closeModal();
        loadEmployees();
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = {
        PayrollNumber: fd.get("PayrollNumber"),
        FirstName: fd.get("FirstName"),
        LastName: fd.get("LastName"),
        EmailAddress: fd.get("EmailAddress"),
        MobileNumber: fd.get("MobileNumber"),
        JobTitle: fd.get("JobTitle"),
        Department: fd.get("Department"),
        EmployeeType: fd.get("EmployeeType"),
        LineManager: fd.get("LineManager") || null,
        StartDate: fd.get("StartDate"),
        EndDate: fd.get("EndDate") || null,
        EmploymentStatus: fd.get("EmploymentStatus"),
        AssetEligible: form.querySelector('[name="AssetEligible"]').checked,
        PayrollDeductionEligible: form.querySelector('[name="PayrollDeductionEligible"]').checked,
      };
      data.FullName = `${data.FirstName} ${data.LastName}`.trim();

      try {
        if (existing) {
          await updateDoc(doc(db, COLLECTIONS.EMPLOYEE_REGISTER, existing.id), data);
          await logAudit({ recordType: "Employee", recordId: existing.id, action: "Update", description: `Updated employee ${data.FullName}` });
          toast("Employee updated", "success");
        } else {
          const id = await nextId("EMP", 4);
          data.CurrentAssetCount = 0;
          data.LastAssetReturn = null;
          data.CreatedDate = nowISO();
          data.CreatedBy = getActingAs().name || "Unknown";
          await setDoc(doc(db, COLLECTIONS.EMPLOYEE_REGISTER, id), data);
          await logAudit({ recordType: "Employee", recordId: id, action: "Create", description: `Created employee ${data.FullName}` });
          toast("Employee created", "success");
        }
        closeModal();
        loadEmployees();
      } catch (err) {
        console.error(err);
        toast("Could not save employee: " + err.message, "error");
      }
    });
  }

  loadEmployees();
</script>
</body>
</html>
