<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Allocate Asset · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad" style="max-width:760px;">
    <div class="section-title">1. Select Employee</div>
    <div class="field" style="max-width:380px;">
      <label>Employee *</label>
      <select id="employee-select"><option value="">Select an employee…</option></select>
    </div>
    <div id="employee-summary" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="scan-card">
    <div class="section-title">2. Scan / Add Assets</div>
    <div style="display:flex; gap:10px; margin-bottom:14px;">
      <input type="text" id="scan-input" placeholder="Scan or enter QR Code / Asset ID, then press Enter" style="flex:1; border:1px solid var(--slate-300); border-radius:6px; padding:9px 10px; font-size:14px;" />
    </div>
    <table class="data-table" id="queue-table" style="display:none;">
      <thead><tr><th>Asset ID</th><th>Name</th><th>Category</th><th></th></tr></thead>
      <tbody id="queue-rows"></tbody>
    </table>
    <div class="empty-state" id="queue-empty">No assets added yet — scan or enter an Asset ID / QR Code above.</div>
  </div>

  <div class="card card-pad" style="max-width:760px; margin-top:20px; display:none;" id="signature-card">
    <div class="section-title">3. Employee Electronic Signature</div>
    <p class="muted" style="margin-top:-6px;">The employee confirms they are accepting responsibility for the asset(s) listed above.</p>
    <div id="signature-host"></div>
    <div class="form-actions">
      <button class="btn btn-primary" id="complete-btn">Complete Allocation</button>
    </div>
  </div>

  <div class="card card-pad" id="result-card" style="display:none; margin-top:20px;">
    <div class="section-title">Allocation Complete</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, nowISO,
    INELIGIBLE_STATUS_REASONS, findEmployeeLocation, adjustEmployeeAssetCount,
    recordMovement, createSignaturePad,
  } from "./shared/common.js";
  import { doc, addDoc, collection, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("allocate-asset", "Allocate Asset");

  let employees = [];
  let selectedEmployee = null;
  let queue = []; // asset docs queued for allocation
  let signaturePad = null;

  async function init() {
    employees = (await fetchAll(COLLECTIONS.EMPLOYEE_REGISTER)).filter(
      (e) => e.EmploymentStatus === "Active" && e.AssetEligible !== false
    );
    const select = document.getElementById("employee-select");
    select.innerHTML = '<option value="">Select an employee…</option>';
    employees.sort((a, b) => (a.FullName || "").localeCompare(b.FullName || ""));
    employees.forEach((e) => select.appendChild(el("option", { value: e.id }, e.FullName)));
  }

  function selectEmployee(id) {
    selectedEmployee = employees.find((emp) => emp.id === id) || null;
    document.getElementById("employee-select").value = selectedEmployee ? selectedEmployee.id : "";
    const summary = document.getElementById("employee-summary");
    if (selectedEmployee) {
      summary.textContent = `${selectedEmployee.JobTitle || ""} · ${selectedEmployee.Department || ""} · currently holds ${selectedEmployee.CurrentAssetCount ?? 0} asset(s)`;
      document.getElementById("scan-card").style.display = "";
      document.getElementById("signature-card").style.display = queue.length ? "" : "none";
      if (!signaturePad) signaturePad = createSignaturePad(document.getElementById("signature-host"));
    } else {
      summary.textContent = "";
      document.getElementById("scan-card").style.display = "none";
      document.getElementById("signature-card").style.display = "none";
    }
  }
  document.getElementById("employee-select").addEventListener("change", (e) => selectEmployee(e.target.value));

  async function findAssetByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (direct) return direct;
    const all = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    return all.find((a) => a.QRCode === value) || null;
  }

  async function tryAddAssetToQueue(value) {
    const asset = await findAssetByIdentifier(value);
    if (!asset) {
      toast('Asset Not Found — "This Asset cannot be allocated"', "error");
      return;
    }
    if (asset.StockItem) {
      toast("Stock items are managed by quantity, not individual allocation.", "info");
      return;
    }
    if (queue.some((a) => a.id === asset.id)) {
      toast("That asset is already in the allocation list.", "info");
      return;
    }
    if (asset.Status !== "Available") {
      const reason = INELIGIBLE_STATUS_REASONS[asset.Status] || `Status is "${asset.Status}"`;
      toast(`Asset Not Eligible for Allocation — ${reason}`, "error");
      return;
    }
    queue.push(asset);
    renderQueue();
    document.getElementById("signature-card").style.display = "";
  }

  document.getElementById("scan-input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    e.target.value = "";
    await tryAddAssetToQueue(value);
  });

  function renderQueue() {
    const table = document.getElementById("queue-table");
    const empty = document.getElementById("queue-empty");
    const rows = document.getElementById("queue-rows");
    rows.innerHTML = "";
    if (queue.length === 0) {
      table.style.display = "none";
      empty.style.display = "";
      return;
    }
    table.style.display = "";
    empty.style.display = "none";
    queue.forEach((a) => {
      rows.appendChild(
        el("tr", { class: "static-row" }, [
          el("td", {}, a.id),
          el("td", {}, a.AssetName),
          el("td", {}, a.Category || "—"),
          el("td", {}, el("button", { class: "btn btn-ghost btn-sm", onclick: () => { queue = queue.filter((q) => q.id !== a.id); renderQueue(); } }, "Remove")),
        ])
      );
    });
  }

  document.getElementById("complete-btn").addEventListener("click", async () => {
    if (!selectedEmployee) { toast("Select an employee first.", "error"); return; }
    if (queue.length === 0) { toast("Add at least one asset first.", "error"); return; }
    if (!signaturePad || signaturePad.isEmpty()) { toast("Electronic signature is required before allocation can be completed.", "error"); return; }

    const btn = document.getElementById("complete-btn");
    btn.disabled = true;
    try {
      const blob = await signaturePad.getBlob();
      const sigRef = ref(storage, `signatures/allocation_${selectedEmployee.id}_${Date.now()}.png`);
      await uploadBytes(sigRef, blob);
      const signatureUrl = await getDownloadURL(sigRef);
      const signedAt = nowISO();
      const employeeLocation = await findEmployeeLocation(selectedEmployee.id);

      for (const asset of queue) {
        await addDoc(collection(db, COLLECTIONS.ASSIGNMENT_HISTORY), {
          AssetID: asset.id,
          EmployeeID: selectedEmployee.id,
          AssignmentType: "Allocation",
          AssignmentStartDate: signedAt,
          AssignmentEndDate: null,
          PreviousEmployeeID: null,
          ElectronicSignature: signatureUrl,
          SignatureDateTime: signedAt,
          CompletedBy: getActingAs().name || "Unknown",
          Notes: `Allocated to ${selectedEmployee.FullName}`,
          CreatedDate: signedAt,
          CreatedBy: getActingAs().name || "Unknown",
        });

        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), {
          Status: "Assigned",
          CurrentEmployee: selectedEmployee.id,
          CurrentLocation: employeeLocation,
        });

        await recordMovement({
          assetId: asset.id,
          action: "Allocated to Employee",
          toLocation: employeeLocation,
          notes: `Allocated to ${selectedEmployee.FullName}`,
        });

        await logAudit({
          recordType: "Asset",
          recordId: asset.id,
          action: "Update",
          description: `Allocated ${asset.AssetName} (${asset.id}) to ${selectedEmployee.FullName}`,
        });
      }

      await adjustEmployeeAssetCount(selectedEmployee.id, queue.length);

      document.getElementById("result-card").style.display = "";
      document.getElementById("result-body").innerHTML = "";
      document.getElementById("result-body").appendChild(
        el("div", {}, [
          el("p", {}, `${queue.length} asset(s) allocated to ${selectedEmployee.FullName}.`),
          ...queue.map((a) => el("div", {}, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(a.id)}` }, `${a.AssetName} — ${a.id} →`))),
        ])
      );
      toast("Allocation complete", "success");

      queue = [];
      renderQueue();
      signaturePad.clear();
      document.getElementById("employee-select").value = "";
      document.getElementById("employee-summary").textContent = "";
      document.getElementById("scan-card").style.display = "none";
      document.getElementById("signature-card").style.display = "none";
      selectedEmployee = null;
      init();
    } catch (err) {
      console.error(err);
      toast("Could not complete allocation: " + err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const assetParam = params.get("asset");
    if (assetParam) {
      // Coming from an asset's record page — jump straight to scanning
      // it in once an employee is chosen. We can't pick the employee
      // for the user (allocation always starts from "who"), so just
      // pre-fill the scan box.
      const input = document.getElementById("scan-input");
      input.value = assetParam;
      toast("Select an employee, then press Enter to add this asset.", "info");
    }
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
