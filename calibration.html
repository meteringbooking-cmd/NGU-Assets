<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calibration · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad" style="max-width:760px;">
    <div class="section-title">1. Select Asset</div>
    <input type="text" id="scan-input" placeholder="Scan or enter QR Code / Asset ID, then press Enter" style="width:100%; border:1px solid var(--steel-300); border-radius:6px; padding:9px 10px; font-size:14px;" />
  </div>

  <div id="asset-card" class="card card-pad" style="display:none; margin-top:20px; max-width:760px;">
    <div class="section-title">Asset</div>
    <div id="asset-summary"></div>
  </div>

  <div id="start-card" class="card card-pad" style="display:none; margin-top:20px; max-width:760px;">
    <div class="section-title">2. Start Calibration</div>
    <form id="start-form" class="field-grid">
      <div class="field"><label>Calibration Provider *</label><select name="CalibrationProvidor" required><option value="">Select…</option></select></div>
      <div class="field"><label>Calibration Start Date *</label><input type="date" name="CalibrationStartDate" required /></div>
      <div class="field"><label>Expected Return Date</label><input type="date" name="ExpectedReturnDate" /></div>
      <div class="form-actions" style="grid-column:1/-1;">
        <button type="submit" class="btn btn-primary">Start Calibration</button>
      </div>
    </form>
  </div>

  <div id="complete-card" class="card card-pad" style="display:none; margin-top:20px; max-width:760px;">
    <div class="section-title">2. Complete Calibration</div>
    <div id="open-cal-summary" class="muted" style="margin-bottom:14px;"></div>
    <form id="complete-form" class="field-grid">
      <div class="field"><label>Calibration Completion Date *</label><input type="date" name="CalibrationCompletionDate" required /></div>
      <div class="field">
        <label>Calibration Result *</label>
        <div class="pill-toggle" id="result-toggle">
          <button type="button" class="active" data-result="Pass">Pass</button>
          <button type="button" data-result="Fail">Fail</button>
        </div>
      </div>
      <div class="field span-2"><label>Calibration Certificate *</label><input type="file" name="CalibrationCertifcate" accept=".pdf,image/*" required /><span class="hint">Mandatory before calibration can be completed.</span></div>
      <div class="field span-2"><label>Calibration Notes</label><textarea name="CalibrationNotes" placeholder="Additional information from provider"></textarea></div>

      <div class="form-section-heading">Outcome</div>
      <div class="field span-2">
        <label>Calibration Outcome *</label>
        <div class="pill-toggle" id="outcome-toggle">
          <button type="button" class="active" data-outcome="Pass">Pass</button>
          <button type="button" data-outcome="Repair Required" id="outcome-repair-btn">Repair Required</button>
          <button type="button" data-outcome="Beyond Repair">Beyond Repair</button>
        </div>
      </div>
      <div class="field span-2" id="evidence-field" style="display:none;"><label>Supporting Evidence *</label><input type="file" name="SupportingEvidence" accept=".pdf,image/*" /><span class="hint">Evidence supporting the repair / beyond repair decision — mandatory for Beyond Repair.</span></div>
      <div class="field" id="est-cost-field" style="display:none;"><label>Estimated Repair Cost (£) *</label><input type="number" step="0.01" min="0.01" name="EstimatedRepairCost" /></div>
      <div class="field" id="replacement-cost-field" style="display:none;"><label>Replacement Cost (£) *</label><input type="number" step="0.01" min="0.01" name="ReplacementCost" /></div>

      <div class="form-actions" style="grid-column:1/-1;">
        <button type="submit" class="btn btn-primary">Complete Calibration</button>
      </div>
    </form>
  </div>

  <div id="result-card" class="card card-pad" style="display:none; margin-top:20px; max-width:760px;">
    <div class="section-title">Done</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, nowISO, todayISO, nextId,
    INELIGIBLE_STATUS_REASONS, findOpenCalibration, calculateNextCalibrationDue, recordMovement,
  } from "./shared/common.js";
  import { doc, addDoc, collection, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("calibration", "Calibration");

  const INELIGIBLE_FOR_CALIBRATION = ["Under Repair", "Away for Calibration", "Awaiting Inspection", "Retired", "Missing", "Stolen"];

  let suppliers = [];
  let assetTypes = [];
  let asset = null;
  let assetType = null;
  let openCal = null;
  let outcome = "Pass";
  let result = "Pass";

  async function init() {
    suppliers = await fetchAll(COLLECTIONS.SUPPLIER_REGISTER);
    assetTypes = await fetchAll(COLLECTIONS.ASSET_TYPES);
  }

  async function findAssetByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (direct) return direct;
    const all = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    return all.find((a) => a.QRCode === value) || null;
  }

  function resetCards() {
    document.getElementById("asset-card").style.display = "none";
    document.getElementById("start-card").style.display = "none";
    document.getElementById("complete-card").style.display = "none";
    document.getElementById("result-card").style.display = "none";
    asset = null;
    openCal = null;
  }

  // Like resetCards(), but leaves the result card alone — for use right
  // after showResult() has just populated and shown it.
  function clearAssetState() {
    document.getElementById("asset-card").style.display = "none";
    document.getElementById("start-card").style.display = "none";
    document.getElementById("complete-card").style.display = "none";
    asset = null;
    openCal = null;
  }

  function renderAssetSummary() {
    const host = document.getElementById("asset-summary");
    host.innerHTML = "";
    host.appendChild(
      el("div", {}, [
        el("p", {}, `${asset.AssetName} — ${asset.id} · ${asset.Category || ""} ${asset.AssetType || ""}`),
        el("p", { class: "muted" }, `Current status: ${asset.Status || "Unknown"}`),
      ])
    );
    document.getElementById("asset-card").style.display = "";
  }

  async function loadAsset(value) {
    const a = await findAssetByIdentifier(value);
    if (!a) {
      toast('Asset Not Found — "Invalid QR Code. Asset cannot be Identified."', "error");
      return;
    }
    if (a.StockItem) {
      toast("Stock items are not individually calibrated.", "info");
      return;
    }
    resetCards();
    asset = a;
    document.getElementById("scan-input").value = "";
    renderAssetSummary();
    assetType = assetTypes.find((t) => t.AssetTypeName === asset.AssetType) || null;
    openCal = await findOpenCalibration(asset.id);

    if (openCal) {
      showCompleteMode();
      return;
    }

    if (INELIGIBLE_FOR_CALIBRATION.includes(asset.Status)) {
      toast(`Asset Not Eligible for Calibration — ${INELIGIBLE_STATUS_REASONS[asset.Status] || `Status is "${asset.Status}"`}`, "error");
      return;
    }
    if (assetType && assetType.CalibrationRequired === false) {
      toast(`${asset.AssetType || "This asset type"} does not require calibration.`, "info");
      return;
    }
    showStartMode();
  }

  document.getElementById("scan-input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    await loadAsset(value);
  });

  /* ---------------- Start Calibration ---------------- */
  function showStartMode() {
    const select = document.querySelector('#start-form [name="CalibrationProvidor"]');
    select.innerHTML = '<option value="">Select…</option>';
    suppliers
      .filter((s) => s.Active !== false && s.CalibrationProvidor === true)
      .forEach((s) => select.appendChild(el("option", { value: s.id }, s.TradingName || s.SupplierName)));
    document.querySelector('#start-form [name="CalibrationStartDate"]').value = todayISO();
    document.querySelector('#start-form [name="ExpectedReturnDate"]').value = "";
    document.getElementById("start-card").style.display = "";
  }

  document.getElementById("start-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!asset) return;
    const fd = new FormData(e.target);
    const providerId = fd.get("CalibrationProvidor");
    if (!providerId) {
      toast("Select a calibration provider.", "error");
      return;
    }
    const provider = suppliers.find((s) => s.id === providerId);
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const now = nowISO();
      const actorName = getActingAs().name || "Unknown";
      const calId = await nextId("CAL", 4);
      const startDate = fd.get("CalibrationStartDate") || todayISO();

      await setDoc(doc(db, COLLECTIONS.CALIBRATION_REGISTER, calId), {
        AssetID: asset.id,
        CalibrationProvidor: providerId,
        PreviousOperationalStatus: asset.Status,
        CalibrationStatus: "Awaiting Calibration",
        CalibrationStartDate: startDate,
        CalibrationCompletionDate: null,
        NextCalibrationDueDate: null,
        ExpectedReturnDate: fd.get("ExpectedReturnDate") || null,
        CalibrationResult: null,
        CalibrationCertifcate: null,
        CalibrationNotes: null,
        CalibrationOutcome: null,
        SupportingEvidence: null,
        EstimatedRepairCost: null,
        ReplacementCost: asset.ReplacementCost || null,
        CreatedDate: now,
        CreatedBy: actorName,
        LastUpdatedDate: now,
        LastUpdatedBy: actorName,
      });

      await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Away for Calibration" });

      await recordMovement({
        assetId: asset.id,
        action: "Sent for Calibration",
        notes: `Sent to ${provider ? provider.TradingName || provider.SupplierName : "provider"} for calibration`,
      });

      await logAudit({
        recordType: "Asset",
        recordId: asset.id,
        action: "Update",
        description: `${asset.AssetName} (${asset.id}) sent for calibration — ${calId}`,
      });

      showResult(
        el("div", {}, [
          el("p", {}, `${asset.AssetName} (${asset.id}) is now away for calibration — ${calId}.`),
          el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(asset.id)}` }, "Open asset record →"),
        ])
      );
      toast("Calibration started", "success");
      clearAssetState();
    } catch (err) {
      console.error(err);
      toast("Could not start calibration: " + err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  /* ---------------- Complete Calibration ---------------- */
  function showCompleteMode() {
    const provider = suppliers.find((s) => s.id === openCal.CalibrationProvidor);
    document.getElementById("open-cal-summary").textContent =
      `${openCal.id} — sent to ${provider ? provider.TradingName || provider.SupplierName : "provider"} on ${openCal.CalibrationStartDate || "?"}` +
      (openCal.ExpectedReturnDate ? ` · expected back ${openCal.ExpectedReturnDate}` : "");

    document.querySelector('#complete-form [name="CalibrationCompletionDate"]').value = todayISO();
    setResult("Pass");
    setOutcome("Pass");

    const repairBtn = document.getElementById("outcome-repair-btn");
    repairBtn.style.display = assetType && assetType.Repairable === false ? "none" : "";

    document.getElementById("complete-card").style.display = "";
  }

  function setResult(value) {
    result = value;
    document.querySelectorAll("#result-toggle button").forEach((b) => b.classList.toggle("active", b.dataset.result === value));
  }
  document.getElementById("result-toggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-result]");
    if (btn) setResult(btn.dataset.result);
  });

  function setOutcome(value) {
    outcome = value;
    document.querySelectorAll("#outcome-toggle button").forEach((b) => b.classList.toggle("active", b.dataset.outcome === value));
    const needsEvidence = value === "Beyond Repair";
    const needsCost = value === "Repair Required" || value === "Beyond Repair";
    document.getElementById("evidence-field").style.display = needsEvidence ? "" : "none";
    document.getElementById("est-cost-field").style.display = needsCost ? "" : "none";
    document.getElementById("replacement-cost-field").style.display = needsCost ? "" : "none";
    if (needsCost) {
      const rc = document.querySelector('#complete-form [name="ReplacementCost"]');
      if (asset && asset.ReplacementCost && !rc.value) rc.value = asset.ReplacementCost;
    }
  }
  document.getElementById("outcome-toggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-outcome]");
    if (btn && btn.style.display !== "none") setOutcome(btn.dataset.outcome);
  });

  document.getElementById("complete-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!asset || !openCal) return;
    const fd = new FormData(e.target);
    const certFile = fd.get("CalibrationCertifcate");
    if (!certFile || certFile.size === 0) {
      toast("A calibration certificate is mandatory before calibration can be completed.", "error");
      return;
    }
    const evidenceFile = fd.get("SupportingEvidence");
    if (outcome === "Beyond Repair" && (!evidenceFile || evidenceFile.size === 0)) {
      toast("Supporting evidence is mandatory when an asset is classified Beyond Repair.", "error");
      return;
    }
    const estCost = Number(fd.get("EstimatedRepairCost"));
    const replCost = Number(fd.get("ReplacementCost"));
    if ((outcome === "Repair Required" || outcome === "Beyond Repair") && (!estCost || estCost <= 0 || !replCost || replCost <= 0)) {
      toast("Estimated repair cost and replacement cost are required and must be greater than £0.", "error");
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const now = nowISO();
      const actorName = getActingAs().name || "Unknown";
      const completionDate = fd.get("CalibrationCompletionDate") || todayISO();

      const certRef = ref(storage, `calibration-certificates/${asset.id}/${Date.now()}_${certFile.name}`);
      await uploadBytes(certRef, certFile);
      const certUrl = await getDownloadURL(certRef);

      let evidenceUrl = null;
      if (evidenceFile && evidenceFile.size > 0) {
        const evRef = ref(storage, `calibration-evidence/${asset.id}/${Date.now()}_${evidenceFile.name}`);
        await uploadBytes(evRef, evidenceFile);
        evidenceUrl = await getDownloadURL(evRef);
      }

      const calibrationStatus =
        outcome === "Pass" ? "Completed" : outcome === "Repair Required" ? "Completed - Repair Required" : "Completed - Beyond Repair";

      await updateDoc(doc(db, COLLECTIONS.CALIBRATION_REGISTER, openCal.id), {
        CalibrationCompletionDate: completionDate,
        CalibrationResult: result,
        CalibrationCertifcate: certUrl,
        CalibrationNotes: fd.get("CalibrationNotes") || null,
        CalibrationOutcome: outcome,
        SupportingEvidence: evidenceUrl,
        EstimatedRepairCost: estCost || null,
        ReplacementCost: replCost || asset.ReplacementCost || null,
        CalibrationStatus: calibrationStatus,
        LastUpdatedDate: now,
        LastUpdatedBy: actorName,
      });

      let resultNodes = [];
      if (outcome === "Pass") {
        const nextDue = assetType
          ? calculateNextCalibrationDue(completionDate, assetType.CalibrationInterval, assetType.CalibrationUnit)
          : null;
        const restoredStatus = openCal.PreviousOperationalStatus || "Available";
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), {
          Status: restoredStatus,
          LastCalibrationDate: completionDate,
          NextCalibrationDueDate: nextDue,
        });
        await recordMovement({ assetId: asset.id, action: "Calibration Completed — Pass", notes: `Result: Pass` });
        resultNodes = [el("p", {}, `${asset.AssetName} (${asset.id}) passed calibration.${nextDue ? ` Next due ${nextDue}.` : ""}`)];
      } else {
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Under Repair" });

        const repairId = await nextId("REP", 4);
        await setDoc(doc(db, COLLECTIONS.REPAIR_REGISTER, repairId), {
          AssetID: asset.id,
          CalibrationID: openCal.id,
          CalibrationProvidor: openCal.CalibrationProvidor,
          RepairProvidor: null,
          RepairStatus: "Awaiting Manager Approval",
          RepairType: null,
          RepairQuotation: null,
          EstimatedRepairCost: estCost || null,
          ReplacementCost: replCost || asset.ReplacementCost || null,
          RepairCostPercentage: null,
          RepairRecommendation: null,
          RecommendationReason: null,
          ManagerDecision: "Awaiting Decision",
          DecisionDate: null,
          DecisionNotes: null,
          RepairDate: null,
          RepairCost: null,
          RepairNotes: null,
          CompletionDate: null,
          BeyondRepair: outcome === "Beyond Repair",
          BeyondRepairReport: null,
          SupportingEvidence: evidenceUrl,
          RetirementRecommendation: outcome === "Beyond Repair",
          RetirementDecision: outcome === "Beyond Repair" ? "Awaiting Decision" : null,
          IndependentTechincalAssessment: null,
          DamageReport: null,
          CreatedDate: now,
          CreatedBy: actorName,
          LastUpdatedDate: now,
          LastUpdatedBy: actorName,
        });

        await recordMovement({
          assetId: asset.id,
          action: outcome === "Beyond Repair" ? "Calibration Completed — Beyond Repair" : "Calibration Completed — Repair Required",
          notes: `Repair job ${repairId} created`,
        });

        resultNodes = [
          el("p", {}, `${asset.AssetName} (${asset.id}) — ${outcome}. Repair job ${repairId} created and awaiting manager approval.`),
          el("a", { class: "text-link", href: `repair.html?asset=${encodeURIComponent(asset.id)}` }, "Open in Repair queue →"),
        ];
      }

      await logAudit({
        recordType: "Asset",
        recordId: asset.id,
        action: "Update",
        description: `${asset.AssetName} (${asset.id}) calibration completed — outcome: ${outcome}`,
      });

      resultNodes.push(el("div", {}, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(asset.id)}` }, "Open asset record →")));
      showResult(el("div", {}, resultNodes));
      toast("Calibration completed", "success");
      clearAssetState();
    } catch (err) {
      console.error(err);
      toast("Could not complete calibration: " + err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  function showResult(node) {
    const card = document.getElementById("result-card");
    const body = document.getElementById("result-body");
    body.innerHTML = "";
    body.appendChild(node);
    card.style.display = "";
  }

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const assetParam = params.get("asset");
    if (assetParam) await loadAsset(assetParam);
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
