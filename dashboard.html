<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="kpi-grid" id="kpi-grid">
    <div class="loading-row"><div class="empty-state">Loading asset KPIs…</div></div>
  </div>

  <div class="dashboard-grid">
    <div class="card card-pad">
      <div class="section-title">Quick Actions</div>
      <div class="quick-actions" id="quick-actions"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:20px;">
      <div class="card card-pad">
        <div class="section-title">Recent Activity</div>
        <ul class="activity-list" id="recent-activity">
          <li class="empty-state">Loading…</li>
        </ul>
      </div>
      <div class="card card-pad">
        <div class="section-title">Notifications</div>
        <ul class="notification-list" id="notifications">
          <li class="empty-state">Loading…</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import { initLayout, el, formatCurrency, formatDateTime, fetchAll, toast } from "./shared/common.js";
  import {
    collection,
    getDocs,
    query,
    orderBy,
    limit,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  initLayout("dashboard", "Dashboard");

  const QUICK_ACTIONS = [
    { label: "Create Asset", href: "create-asset.html" },
    { label: "View Asset Register", href: "asset-register.html" },
    { label: "Allocate Asset", href: "allocate-asset.html" },
    { label: "Transfer Asset", href: "transfer-asset.html" },
    { label: "Receive Returned Asset", href: "return-asset.html" },
    { label: "Start Calibration", href: "calibration.html" },
    { label: "Repair Queue", href: "repair.html" },
    { label: "Report Damage / Missing Asset", soon: true },
  ];

  const actionsHost = document.getElementById("quick-actions");
  QUICK_ACTIONS.forEach((a) => {
    const btn = el("a", { class: "quick-action-btn", href: a.href || "#" }, a.label);
    if (a.soon) {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        toast(`${a.label} is planned for the next build phase.`, "info");
      });
    }
    actionsHost.appendChild(btn);
  });

  const STATUS_ACCENTS = {
    Available: "green",
    Assigned: "teal",
    "Awaiting Inspection": "amber",
    "Under Repair": "amber",
    "Calibration Due": "amber",
    Retired: "slate",
    Missing: "red",
    Stolen: "red",
  };

  async function loadKpis() {
    const grid = document.getElementById("kpi-grid");
    grid.innerHTML = "";
    let assets = [];
    try {
      assets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    } catch (err) {
      console.warn(err);
    }

    const total = assets.length;
    const totalValue = assets.reduce((sum, a) => sum + (Number(a.PurchaseCost) || 0), 0);
    const countByStatus = (status) => assets.filter((a) => a.Status === status).length;
    const calibrationDueSoon = assets.filter((a) => {
      if (!a.NextCalibrationDueDate) return false;
      const due = new Date(a.NextCalibrationDueDate);
      const in30 = new Date();
      in30.setDate(in30.getDate() + 30);
      return due <= in30;
    }).length;

    const tiles = [
      { label: "Total Assets", value: total, accent: "teal" },
      { label: "Available", value: countByStatus("Available"), accent: "green" },
      { label: "Assigned", value: countByStatus("Assigned"), accent: "teal" },
      { label: "Awaiting Inspection", value: countByStatus("Awaiting Inspection"), accent: "amber" },
      { label: "Under Repair", value: countByStatus("Under Repair"), accent: "amber" },
      { label: "Away for Calibration", value: countByStatus("Away for Calibration"), accent: "amber" },
      { label: "Calibration Due (30d)", value: calibrationDueSoon, accent: "amber" },
      { label: "Retired", value: countByStatus("Retired"), accent: "slate" },
      { label: "Missing / Stolen", value: countByStatus("Missing") + countByStatus("Stolen"), accent: "red" },
    ];

    tiles.forEach((t) => {
      grid.appendChild(
        el("div", { class: `kpi-tile accent-${t.accent}` }, [
          el("div", { class: "kpi-value" }, String(t.value)),
          el("div", { class: "kpi-label" }, t.label),
        ])
      );
    });

    // Total value — visible to everyone for now (no roles/auth yet), but
    // tucked behind a reveal click since the dictionary marks it Finance-only.
    const valueTile = el("div", { class: "kpi-tile accent-slate" }, [
      el("div", { class: "kpi-value", html: "••••••" }),
      el("div", { class: "kpi-label" }, "Total Value (click to reveal — Finance only once roles exist)"),
    ]);
    valueTile.style.cursor = "pointer";
    valueTile.addEventListener("click", () => {
      valueTile.querySelector(".kpi-value").textContent = formatCurrency(totalValue);
    });
    grid.appendChild(valueTile);

    if (total === 0) {
      grid.appendChild(
        el("div", { class: "empty-state", style: "grid-column: 1/-1;" }, "No assets yet — create your first asset to see live KPIs here.")
      );
    }
  }

  async function loadRecentActivity() {
    const list = document.getElementById("recent-activity");
    list.innerHTML = "";
    try {
      const q = query(collection(db, COLLECTIONS.AUDIT_LOG), orderBy("timestampClient", "desc"), limit(8));
      const snap = await getDocs(q);
      if (snap.empty) {
        list.appendChild(el("li", { class: "empty-state" }, "No activity recorded yet."));
        return;
      }
      snap.docs.forEach((d) => {
        const a = d.data();
        list.appendChild(
          el("li", {}, [
            el("span", {}, a.description || `${a.action} — ${a.recordType}`),
            el("span", { class: "muted" }, formatDateTime(a.timestampClient)),
          ])
        );
      });
    } catch (err) {
      list.appendChild(el("li", { class: "empty-state" }, "Activity will appear here once you start using the system."));
    }
  }

  async function loadNotifications() {
    const list = document.getElementById("notifications");
    list.innerHTML = "";
    const items = [];
    try {
      const assets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
      const in30 = new Date();
      in30.setDate(in30.getDate() + 30);
      const assetsById = {};
      assets.forEach((a) => {
        assetsById[a.id] = a;
        if (a.NextCalibrationDueDate && new Date(a.NextCalibrationDueDate) <= in30) {
          items.push(`${a.AssetName || a.id} — calibration due ${a.NextCalibrationDueDate}`);
        }
      });

      const today = new Date();
      try {
        const calibrations = await fetchAll(COLLECTIONS.CALIBRATION_REGISTER);
        calibrations
          .filter((c) => c.ExpectedReturnDate && !c.CalibrationCompletionDate && new Date(c.ExpectedReturnDate) < today)
          .forEach((c) => {
            const a = assetsById[c.AssetID];
            items.push(`${a ? a.AssetName : c.AssetID} — overdue return from calibration (expected ${c.ExpectedReturnDate})`);
          });
      } catch {}

      try {
        const repairs = await fetchAll(COLLECTIONS.REPAIR_REGISTER);
        repairs
          .filter((r) => r.RepairStatus === "Awaiting Manager Approval" || (r.RepairQuotation && (!r.ManagerDecision || r.ManagerDecision === "Awaiting Decision")))
          .forEach((r) => {
            const a = assetsById[r.AssetID];
            items.push(`${a ? a.AssetName : r.AssetID} — repair job ${r.id} awaiting manager decision`);
          });
        repairs
          .filter((r) => r.BeyondRepair && (!r.RetirementDecision || r.RetirementDecision === "Awaiting Decision"))
          .forEach((r) => {
            const a = assetsById[r.AssetID];
            items.push(`${a ? a.AssetName : r.AssetID} — beyond repair, awaiting retirement decision`);
          });
      } catch {}
    } catch {}

    if (items.length === 0) {
      list.appendChild(el("li", { class: "empty-state" }, "No notifications right now."));
    } else {
      items.slice(0, 8).forEach((msg) => list.appendChild(el("li", {}, msg)));
    }
  }

  loadKpis();
  loadRecentActivity();
  loadNotifications();
</script>
</body>
</html>
