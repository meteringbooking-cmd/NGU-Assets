<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retirement · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad">
    <div class="section-title">Open Retirement Cases</div>
    <table class="data-table" id="queue-table" style="display:none;">
      <thead><tr><th>Retirement ID</th><th>Asset</th><th>Reason</th><th>Originating Process</th><th>Status</th></tr></thead>
      <tbody id="queue-rows"></tbody>
    </table>
    <div class="empty-state" id="queue-empty">No open retirement cases right now.</div>
  </div>

  <div class="card card-pad" style="margin-top:20px; max-width:820px;">
    <div class="section-title">Retire an Asset</div>
    <input type="text" id="scan-input" placeholder="Scan/enter Asset ID or QR Code, then press Enter" style="width:100%; max-width:500px; border:1px solid var(--steel-300); border-radius:6px; padding:9px 10px; font-size:14px;" />
  </div>

  <div id="start-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">New Retirement</div>
    <div id="start-summary" class="muted" style="margin-bottom:14px;"></div>
    <div id="start-host"></div>
  </div>

  <div id="detail-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Retirement Case</div>
    <div id="detail-summary" class="muted" style="margin-bottom:14px;"></div>
    <div id="stage-host"></div>
  </div>

  <div id="result-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Done</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, nowISO, todayISO, nextId,
    findAllOpenRetirements, findOpenRetirement, findActiveAssignment, checkOutstandingActions, recordMovement,
  } from "./shared/common.js";
  import { doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  initLayout("retirement", "Retirement");

  const RETIREMENT_REASONS = [
    "Beyond Economic Repair", "Beyond Repair", "End of Service Life", "Obsolete Equipment",
    "Lost (Permanent)", "Stolen (Written Off)", "Manufacturer Recall", "Unsafe to Use", "Other",
  ];
  const DECLINE_REASONS = ["Repair Instead", "Return to Service", "Await Further Assessment", "Disposal Decision Deferred"];
  const DISPOSAL_METHODS = ["Recycled", "Scrap", "Returned to Manufacturer", "Returned to Supplier", "Sold", "Auction", "Destroyed", "Donated", "Other"];

  let assetsById = {};
  let asset = null;
  let retirement = null;

  async function init() {
    const allAssets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    assetsById = {};
    allAssets.forEach((a) => (assetsById[a.id] = a));
    await loadQueue();
  }

  async function loadQueue() {
    const open = await findAllOpenRetirements();
    const table = document.getElementById("queue-table");
    const empty = document.getElementById("queue-empty");
    const rows = document.getElementById("queue-rows");
    rows.innerHTML = "";
    if (open.length === 0) {
      table.style.display = "none";
      empty.style.display = "";
      return;
    }
    table.style.display = "";
    empty.style.display = "none";
    open.forEach((r) => {
      const a = assetsById[r.AssetID];
      rows.appendChild(
        el("tr", { onclick: () => loadRetirement(r) }, [
          el("td", {}, r.id),
          el("td", {}, a ? `${a.AssetName} — ${a.id}` : r.AssetID),
          el("td", {}, r.RetirementReason || ""),
          el("td", {}, r.OriginatingProcess || "Direct"),
          el("td", {}, el("span", { class: "badge badge-amber" }, r.RetirementStatus || "Manager Review")),
        ])
      );
    });
  }

  /* ---------------- Start a new retirement ---------------- */
  async function findAssetByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (direct) return direct;
    return Object.values(assetsById).find((a) => a.QRCode === value) || null;
  }

  function resetAll() {
    document.getElementById("start-card").style.display = "none";
    document.getElementById("detail-card").style.display = "none";
    document.getElementById("result-card").style.display = "none";
    asset = null;
    retirement = null;
  }

  async function loadAsset(value) {
    const a = await findAssetByIdentifier(value);
    if (!a) {
      toast('Asset Not Found — "Invalid QR Code. Asset cannot be Identified."', "error");
      return;
    }
    if (a.Status === "Retired") {
      toast("Asset Not Eligible for Retirement — this asset has already been retired.", "error");
      return;
    }
    const existingOpen = await findOpenRetirement(a.id);
    if (existingOpen) {
      toast(`This asset already has an open retirement case (${existingOpen.id}) — opening it instead.`, "info");
      resetAll();
      await loadRetirement(existingOpen);
      return;
    }
    resetAll();
    asset = a;
    document.getElementById("scan-input").value = "";
    document.getElementById("start-card").style.display = "";
    document.getElementById("start-summary").innerHTML = "";
    document.getElementById("start-summary").appendChild(el("p", {}, `${a.AssetName} (${a.id}) — Status: ${a.Status || "Unknown"}`));
    document.getElementById("start-host").innerHTML = "";
    document.getElementById("start-host").appendChild(renderStartForm());
  }

  document.getElementById("scan-input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    await loadAsset(value);
  });

  function renderStartForm() {
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [
        el("label", {}, "Retirement Reason *"),
        el("select", { name: "RetirementReason", required: "required" }, [
          el("option", { value: "" }, "Select…"),
          ...RETIREMENT_REASONS.map((r) => el("option", { value: r }, r)),
        ]),
      ]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Submit for Manager Review")]),
    ]);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const reason = fd.get("RetirementReason");
      if (!reason) return toast("A retirement reason must be selected before the retirement can proceed.", "error");
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const now = nowISO();
        const actorName = getActingAs().name || "Unknown";
        const id = await nextId("RET", 4);
        const rec = {
          AssetID: asset.id,
          QRCode: asset.QRCode || null,
          OriginatingProcess: "Direct",
          OriginatingProcessID: null,
          RetirementReason: reason,
          RetirementStatus: "Manager Review",
          OutstandingActionsCheck: false,
          OutstandingActions: null,
          ActionsResolved: false,
          ActionsResolvedDate: null,
          ManagerDecision: "Awaiting Decision",
          DecisionDate: null,
          DecisionNotes: null,
          DeclineReason: null,
          DisposalMethod: null,
          DisposalReference: null,
          DisposalCompletionDate: null,
          DisposalStatus: "Await Disposal",
          RetirementCompletedDate: null,
          AssetInactive: false,
          AllocationBlocked: false,
          CreatedDate: now,
          CreatedBy: actorName,
          LastUpdatedDate: now,
          LastUpdatedBy: actorName,
        };
        await setDoc(doc(db, COLLECTIONS.RETIREMENT_REGISTER, id), rec);
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Retirement case ${id} opened for ${asset.AssetName} (${asset.id}) — ${reason}` });
        toast("Retirement case submitted for manager review", "success");
        resetAll();
        await loadRetirement({ id, ...rec });
        await loadQueue();
      } catch (err) {
        console.error(err);
        toast("Could not start retirement: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    return form;
  }

  /* ---------------- Working an existing retirement case ---------------- */
  async function loadRetirement(value) {
    const rec = typeof value === "object" ? value : await fetchOne(COLLECTIONS.RETIREMENT_REGISTER, value);
    if (!rec) {
      toast("Retirement case not found.", "error");
      return;
    }
    resetAll();
    retirement = rec;
    asset = (await fetchOne(COLLECTIONS.ASSET_REGISTER, rec.AssetID)) || assetsById[rec.AssetID];
    document.getElementById("scan-input").value = "";
    await renderRetirementStage();
  }

  async function saveRetirement(patch) {
    const actorName = getActingAs().name || "Unknown";
    patch.LastUpdatedDate = nowISO();
    patch.LastUpdatedBy = actorName;
    await updateDoc(doc(db, COLLECTIONS.RETIREMENT_REGISTER, retirement.id), patch);
    Object.assign(retirement, patch);
  }

  async function renderRetirementStage() {
    document.getElementById("detail-card").style.display = "";
    document.getElementById("result-card").style.display = "none";
    document.getElementById("detail-summary").innerHTML = "";
    document.getElementById("detail-summary").appendChild(
      el("div", {}, [
        el("p", {}, `${asset.AssetName} (${asset.id}) — Retirement ${retirement.id}`),
        el("p", { class: "muted" }, `${retirement.RetirementReason || ""}${retirement.OriginatingProcess && retirement.OriginatingProcess !== "Direct" ? ` · via ${retirement.OriginatingProcess}${retirement.OriginatingProcessID ? ` (${retirement.OriginatingProcessID})` : ""}` : ""}`),
      ])
    );
    const host = document.getElementById("stage-host");
    host.innerHTML = "";

    if (["Retirement Complete", "Declined"].includes(retirement.RetirementStatus)) {
      host.appendChild(el("div", { class: "empty-state" }, "This retirement case has already been closed."));
      return;
    }
    if (retirement.RetirementStatus === "Manager Review") {
      host.appendChild(renderManagerReviewStage());
      return;
    }
    // RetirementStatus === "Awaiting Disposal"
    if (!retirement.ActionsResolved) {
      host.appendChild(await renderOutstandingActionsStage());
    } else {
      host.appendChild(renderDisposalStage());
    }
  }

  function renderManagerReviewStage() {
    const wrap = el("div", {});
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [
        el("label", {}, "Retirement Approved? *"),
        el("div", { class: "pill-toggle", id: "decision-toggle" }, [
          el("button", { type: "button", class: "active", "data-decision": "Approved" }, "Approved"),
          el("button", { type: "button", "data-decision": "Declined" }, "Declined"),
        ]),
      ]),
      el("div", { class: "field span-2", id: "decline-reason-field", style: "display:none;" }, [
        el("label", {}, "Reason for Declining *"),
        el("select", { name: "DeclineReason" }, [el("option", { value: "" }, "Select…"), ...DECLINE_REASONS.map((r) => el("option", { value: r }, r))]),
      ]),
      el("div", { class: "field span-2" }, [el("label", {}, "Decision Notes"), el("textarea", { name: "DecisionNotes" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Record Decision")]),
    ]);
    wrap.appendChild(form);

    let decision = "Approved";
    form.querySelector("#decision-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-decision]");
      if (!btn) return;
      decision = btn.dataset.decision;
      form.querySelectorAll("#decision-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
      form.querySelector("#decline-reason-field").style.display = decision === "Declined" ? "" : "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        if (decision === "Declined") {
          const declineReason = fd.get("DeclineReason");
          if (!declineReason) return toast("A reason for declining must be selected.", "error");
          await saveRetirement({
            ManagerDecision: "Declined",
            DecisionDate: todayISO(),
            DecisionNotes: fd.get("DecisionNotes") || null,
            DeclineReason: declineReason,
            RetirementStatus: "Declined",
          });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Retirement ${retirement.id} declined for ${asset.AssetName} (${asset.id}) — ${declineReason}` });
          finishRetirement(el("p", {}, `Retirement case ${retirement.id} declined — ${declineReason}. ${asset.AssetName} (${asset.id}) remains in service.`));
        } else {
          await saveRetirement({
            ManagerDecision: "Approved",
            DecisionDate: todayISO(),
            DecisionNotes: fd.get("DecisionNotes") || null,
            RetirementStatus: "Awaiting Disposal",
          });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Retirement ${retirement.id} approved for ${asset.AssetName} (${asset.id})` });
          toast("Retirement approved — checking for outstanding actions…", "success");
          await renderRetirementStage();
        }
      } catch (err) {
        console.error(err);
        toast("Could not record decision: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    return wrap;
  }

  async function renderOutstandingActionsStage() {
    const wrap = el("div", {});
    const actions = await checkOutstandingActions(asset.id);

    if (actions.length === 0) {
      // Clear — finalise the retirement side of things and move to disposal.
      const active = await findActiveAssignment(asset.id);
      if (active) {
        await updateDoc(doc(db, COLLECTIONS.ASSIGNMENT_HISTORY, active.id), { AssignmentEndDate: nowISO() });
      }
      await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Retired", CurrentEmployee: null });
      await saveRetirement({ OutstandingActionsCheck: true, OutstandingActions: null, ActionsResolved: true, ActionsResolvedDate: nowISO() });
      await recordMovement({ assetId: asset.id, action: "Retired", notes: `Retirement ${retirement.id} — ${retirement.RetirementReason || ""}` });
      await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) status set to Retired — retirement ${retirement.id}` });
      wrap.appendChild(renderDisposalStage());
      return wrap;
    }

    wrap.appendChild(
      el("div", { class: "card-pad", style: "background:var(--red-50, #fef2f2); border-radius:6px; margin-bottom:16px; padding:14px; border:1px solid var(--red-600);" }, [
        el("p", {}, el("strong", {}, "Outstanding actions must be resolved before this asset can be retired:")),
        el("ul", { style: "margin:8px 0 0 18px;" }, actions.map((a) => el("li", {}, a))),
      ])
    );
    await saveRetirement({ OutstandingActionsCheck: true, OutstandingActions: actions.join("; ") });
    const btn = el("button", { type: "button", class: "btn btn-primary" }, "Re-check Outstanding Actions");
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        await renderRetirementStage();
      } finally {
        btn.disabled = false;
      }
    });
    wrap.appendChild(btn);
    return wrap;
  }

  function renderDisposalStage() {
    const wrap = el("div", {});
    wrap.appendChild(
      el("div", { class: "card-pad", style: "background:var(--steel-50); border-radius:6px; margin-bottom:16px; padding:14px;" }, [
        el("p", {}, el("strong", {}, "Outstanding actions cleared.")),
        el("p", { class: "muted" }, `${asset.AssetName} (${asset.id}) is now marked Retired and cannot be allocated. It remains in the Await Disposal stage until physical disposal is completed.`),
      ])
    );

    const methodSelect = el("select", { name: "DisposalMethod", required: "required" }, [
      el("option", { value: "" }, "Select…"),
      ...DISPOSAL_METHODS.map((m) => el("option", { value: m }, m)),
    ]);
    if (retirement.DisposalMethod) methodSelect.value = retirement.DisposalMethod;

    const methodForm = el("form", { class: "field-grid" }, [
      el("div", { class: "field" }, [el("label", {}, "Disposal Method *"), methodSelect]),
      el("div", { class: "field" }, [el("label", {}, "Disposal Reference"), el("input", { type: "text", name: "DisposalReference", value: retirement.DisposalReference || "", placeholder: "e.g. WEEE-2026-00125, Waste Transfer Note, Sales Invoice…" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-ghost" }, "Save Disposal Details")]),
    ]);
    methodForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(methodForm);
      const method = fd.get("DisposalMethod");
      if (!method) return toast("Disposal method is mandatory.", "error");
      try {
        await saveRetirement({ DisposalMethod: method, DisposalReference: fd.get("DisposalReference") || null });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Retirement ${retirement.id} disposal method recorded — ${method}` });
        toast("Disposal details saved", "success");
      } catch (err) {
        console.error(err);
        toast("Could not save disposal details: " + err.message, "error");
      }
    });
    wrap.appendChild(methodForm);

    wrap.appendChild(el("hr", { style: "border:none; border-top:1px solid var(--steel-200); margin:20px 0;" }));
    wrap.appendChild(el("div", { class: "form-section-heading" }, "Disposal Complete?"));

    const completeForm = el("form", { class: "field-grid" }, [
      el("div", { class: "field" }, [el("label", {}, "Disposal Completion Date *"), el("input", { type: "date", name: "DisposalCompletionDate", required: "required", value: todayISO() })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Mark Disposal Complete")]),
    ]);
    completeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!retirement.DisposalMethod) return toast("Save the disposal method before marking disposal complete.", "error");
      const fd = new FormData(completeForm);
      const completionDate = fd.get("DisposalCompletionDate");
      if (!completionDate) return toast("Disposal completion date is required before the retirement process can be completed.", "error");
      const btn = completeForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const now = nowISO();
        await saveRetirement({
          DisposalCompletionDate: completionDate,
          DisposalStatus: "Disposed",
          RetirementStatus: "Retirement Complete",
          RetirementCompletedDate: now,
          AssetInactive: true,
          AllocationBlocked: true,
        });
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Active: false });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) disposal completed (${retirement.DisposalMethod}) — retirement ${retirement.id} closed` });
        finishRetirement(
          el("div", {}, [
            el("p", {}, `Retirement case ${retirement.id} complete — ${asset.AssetName} (${asset.id}) disposed via ${retirement.DisposalMethod}.`),
            el("p", { class: "muted" }, "The asset is now marked inactive and cannot be allocated or issued."),
          ])
        );
      } catch (err) {
        console.error(err);
        toast("Could not complete disposal: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
    wrap.appendChild(completeForm);

    return wrap;
  }

  function finishRetirement(node) {
    document.getElementById("detail-card").style.display = "none";
    const card = document.getElementById("result-card");
    const body = document.getElementById("result-body");
    body.innerHTML = "";
    body.appendChild(node);
    body.appendChild(el("div", { style: "margin-top:10px;" }, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(asset.id)}` }, "Open asset record →")));
    card.style.display = "";
    retirement = null;
    asset = null;
    loadQueue();
  }

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const assetParam = params.get("asset");
    if (assetParam) await loadAsset(assetParam);
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
