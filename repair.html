<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repair · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="card card-pad">
    <div class="section-title">Open Repair Jobs</div>
    <div style="margin-bottom:14px;">
      <input type="text" id="scan-input" placeholder="Scan/enter Asset ID, QR Code, or Repair ID, then press Enter" style="width:100%; max-width:500px; border:1px solid var(--steel-300); border-radius:6px; padding:9px 10px; font-size:14px;" />
    </div>
    <table class="data-table" id="queue-table" style="display:none;">
      <thead><tr><th>Repair ID</th><th>Asset</th><th>Status</th><th>Created</th></tr></thead>
      <tbody id="queue-rows"></tbody>
    </table>
    <div class="empty-state" id="queue-empty">No open repair jobs right now.</div>
  </div>

  <div id="detail-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Repair Job</div>
    <div id="detail-summary" class="muted" style="margin-bottom:14px;"></div>
    <div id="stage-host"></div>
  </div>

  <div id="result-card" class="card card-pad" style="display:none; margin-top:20px; max-width:820px;">
    <div class="section-title">Done</div>
    <div id="result-body"></div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, requirePin, nowISO, todayISO, nextId,
    findAllOpenRepairs, recordMovement,
  } from "./shared/common.js";
  import { doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("repair", "Repair");

  const REPAIR_THRESHOLD = 0.6; // repair cost as a % of replacement cost, above which retirement is recommended

  let suppliers = [];
  let assetsById = {};
  let repair = null;
  let asset = null;

  async function init() {
    suppliers = await fetchAll(COLLECTIONS.SUPPLIER_REGISTER);
    const allAssets = await fetchAll(COLLECTIONS.ASSET_REGISTER);
    assetsById = {};
    allAssets.forEach((a) => (assetsById[a.id] = a));
    await loadQueue();
  }

  async function loadQueue() {
    const open = await findAllOpenRepairs();
    const table = document.getElementById("queue-table");
    const empty = document.getElementById("queue-empty");
    const rows = document.getElementById("queue-rows");
    rows.innerHTML = "";
    if (open.length === 0) {
      table.style.display = "none";
      empty.style.display = "";
      return;
    }
    table.style.display = "";
    empty.style.display = "none";
    open.forEach((r) => {
      const a = assetsById[r.AssetID];
      rows.appendChild(
        el("tr", { onclick: () => loadRepair(r.id) }, [
          el("td", {}, r.id),
          el("td", {}, a ? `${a.AssetName} — ${a.id}` : r.AssetID),
          el("td", {}, el("span", { class: `badge ${r.BeyondRepair ? "badge-red" : "badge-amber"}` }, r.RepairStatus || "Open")),
          el("td", {}, (r.CreatedDate || "").slice(0, 10)),
        ])
      );
    });
  }

  async function findRepairByIdentifier(value) {
    const direct = await fetchOne(COLLECTIONS.REPAIR_REGISTER, value);
    if (direct) return direct;
    // Try as an Asset ID
    let a = await fetchOne(COLLECTIONS.ASSET_REGISTER, value);
    if (!a) {
      const all = Object.values(assetsById);
      a = all.find((x) => x.QRCode === value) || null;
    }
    if (!a) return { repair: null, asset: null };
    const openRepairs = await findAllOpenRepairs();
    const match = openRepairs.find((r) => r.AssetID === a.id) || null;
    return { repair: match, asset: a };
  }

  async function loadRepair(value) {
    let r, a;
    if (typeof value === "object") {
      r = value.repair;
      a = value.asset;
    } else {
      const found = await findRepairByIdentifier(value);
      if (found && found.id) {
        r = found;
      } else {
        r = found.repair;
        a = found.asset;
      }
    }
    if (!r) {
      toast(
        'Repair Job Invalid — "The asset is not currently Under Repair or a valid Repair Job could not be found." Please check the asset status and Repair Job before continuing.',
        "error"
      );
      return;
    }
    if (!a) a = await fetchOne(COLLECTIONS.ASSET_REGISTER, r.AssetID);
    if (!a || a.Status !== "Under Repair") {
      toast(
        'Repair Job Invalid — "The asset is not currently Under Repair or a valid Repair Job could not be found." Please check the asset status and Repair Job before continuing.',
        "error"
      );
      return;
    }
    repair = r;
    asset = a;
    document.getElementById("scan-input").value = "";
    document.getElementById("result-card").style.display = "none";
    renderStage();
  }

  document.getElementById("scan-input").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    await loadRepair(value);
  });

  function stageFor(r) {
    if (r.RepairStatus && r.RepairStatus.startsWith("Completed")) return "done";
    if (r.BeyondRepair === true) {
      if (r.RetirementDecision === "Approved") return "done";
      return "beyond-repair";
    }
    if (!r.RepairQuotation) return "quotation";
    if (!r.ManagerDecision || r.ManagerDecision === "Awaiting Decision") return "manager-decision";
    if (r.ManagerDecision === "Rejected") return "beyond-repair";
    if (r.ManagerDecision === "Approved" && !r.CompletionDate) return "repair-details";
    return "done";
  }

  async function saveRepair(patch) {
    const actorName = getActingAs().name || "Unknown";
    patch.LastUpdatedDate = nowISO();
    patch.LastUpdatedBy = actorName;
    await updateDoc(doc(db, COLLECTIONS.REPAIR_REGISTER, repair.id), patch);
    Object.assign(repair, patch);
  }

  function renderStage() {
    document.getElementById("detail-card").style.display = "";
    const provider = suppliers.find((s) => s.id === repair.RepairProvidor);
    document.getElementById("detail-summary").innerHTML = "";
    document.getElementById("detail-summary").appendChild(
      el("div", {}, [
        el("p", {}, `${asset.AssetName} (${asset.id}) — Repair Job ${repair.id}${repair.CalibrationID ? ` · from calibration ${repair.CalibrationID}` : ""}`),
        provider ? el("p", { class: "muted" }, `Provider: ${provider.TradingName || provider.SupplierName}`) : null,
      ])
    );

    const host = document.getElementById("stage-host");
    host.innerHTML = "";
    const stage = stageFor(repair);

    if (stage === "quotation") host.appendChild(renderQuotationStage());
    else if (stage === "manager-decision") host.appendChild(renderManagerDecisionStage());
    else if (stage === "repair-details") host.appendChild(renderRepairDetailsStage());
    else if (stage === "beyond-repair") host.appendChild(renderBeyondRepairStage());
    else host.appendChild(el("div", { class: "empty-state" }, "This repair job has already been completed."));
  }

  /* ---------------- Stage 1: Can it be repaired? + Quotation ---------------- */
  function renderQuotationStage() {
    const wrap = el("div", {});
    wrap.appendChild(el("div", { class: "form-section-heading" }, "Can this asset be repaired?"));
    const toggle = el("div", { class: "pill-toggle", style: "margin-bottom:16px;" }, [
      el("button", { type: "button", class: "active", onclick: () => setCanRepair(true) }, "Yes"),
      el("button", { type: "button", onclick: () => setCanRepair(false) }, "No — Beyond Repair"),
    ]);
    wrap.appendChild(toggle);

    const form = el("form", { class: "field-grid", id: "quotation-form" }, [
      el("div", { class: "field" }, [
        el("label", {}, "Repair Provider *"),
        buildProviderSelect("RepairProvidor"),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, "Repair Type *"),
        el("select", { name: "RepairType", required: "required" }, [
          el("option", { value: "" }, "Select…"),
          el("option", { value: "Internal Repair" }, "Internal Repair"),
          el("option", { value: "External Repair" }, "External Repair"),
        ]),
      ]),
      el("div", { class: "field span-2" }, [
        el("label", {}, "Repair Quotation *"),
        el("input", { type: "file", name: "RepairQuotation", accept: ".pdf,image/*", required: "required" }),
        el("span", { class: "hint" }, "Mandatory before manager review."),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, "Estimated Repair Cost (£) *"),
        el("input", { type: "number", step: "0.01", min: "0.01", name: "EstimatedRepairCost", required: "required" }),
      ]),
      el("div", { class: "field" }, [
        el("label", {}, "Replacement Cost (£) *"),
        el("input", { type: "number", step: "0.01", min: "0.01", name: "ReplacementCost", required: "required", value: repair.ReplacementCost || asset.ReplacementCost || "" }),
      ]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [
        el("button", { type: "submit", class: "btn btn-primary" }, "Submit for Manager Review"),
      ]),
    ]);
    wrap.appendChild(form);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const quoteFile = fd.get("RepairQuotation");
      const estCost = Number(fd.get("EstimatedRepairCost"));
      const replCost = Number(fd.get("ReplacementCost"));
      if (!fd.get("RepairProvidor")) return toast("Repair Provider is required.", "error");
      if (!fd.get("RepairType")) return toast("Repair Type (Internal / External) is required.", "error");
      if (!quoteFile || quoteFile.size === 0) return toast("Repair quotation must be attached.", "error");
      if (!estCost || estCost <= 0) return toast("Repair cost is required and must be greater than £0.", "error");
      if (!replCost || replCost <= 0) return toast("Replacement cost must be recorded.", "error");

      if (!(await requirePin("Submit Repair Quotation"))) return;

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const quoteRef = ref(storage, `repair-quotations/${asset.id}/${Date.now()}_${quoteFile.name}`);
        await uploadBytes(quoteRef, quoteFile);
        const quoteUrl = await getDownloadURL(quoteRef);
        const pct = estCost / replCost;
        const recommendation = pct <= REPAIR_THRESHOLD ? "Repair Recommended" : "Retirement Recommended";
        const reason =
          pct <= REPAIR_THRESHOLD
            ? `Repair cost is ${(pct * 100).toFixed(0)}% of replacement value, within the configured ${REPAIR_THRESHOLD * 100}% threshold.`
            : `Repair cost is ${(pct * 100).toFixed(0)}% of replacement value, above the configured ${REPAIR_THRESHOLD * 100}% threshold.`;

        await saveRepair({
          RepairProvidor: fd.get("RepairProvidor"),
          RepairType: fd.get("RepairType"),
          RepairQuotation: quoteUrl,
          EstimatedRepairCost: estCost,
          ReplacementCost: replCost,
          RepairCostPercentage: pct,
          RepairRecommendation: recommendation,
          RecommendationReason: reason,
        });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Repair quotation recorded for ${asset.AssetName} (${asset.id}) — ${recommendation}` });
        toast("Quotation recorded — awaiting manager decision", "success");
        renderStage();
      } catch (err) {
        console.error(err);
        toast("Could not save quotation: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    return wrap;
  }

  async function setCanRepair(canRepair) {
    if (canRepair) return; // default state already shows the quotation form
    if (!confirm("Mark this asset as Beyond Repair? This routes it to the retirement decision instead of a repair quotation.")) return;
    if (!(await requirePin("Mark Beyond Repair"))) return;
    await saveRepair({ BeyondRepair: true, RetirementRecommendation: true, RetirementDecision: "Awaiting Decision" });
    renderStage();
  }

  function buildProviderSelect(name) {
    const select = el("select", { name, required: "required" }, [el("option", { value: "" }, "Select…")]);
    suppliers
      .filter((s) => s.Active !== false && s.RepairProvider === true)
      .forEach((s) => select.appendChild(el("option", { value: s.id }, s.TradingName || s.SupplierName)));
    return select;
  }

  /* ---------------- Stage 2: Manager Decision (repair cost) ---------------- */
  function renderManagerDecisionStage() {
    const wrap = el("div", {});
    wrap.appendChild(
      el("div", { class: "card-pad", style: "background:var(--steel-50); border-radius:6px; margin-bottom:16px; padding:14px;" }, [
        el("p", {}, [el("strong", {}, "System Recommendation: "), repair.RepairRecommendation || "—"]),
        el("p", { class: "muted" }, repair.RecommendationReason || ""),
        el("p", { class: "muted" }, `Estimated repair cost £${repair.EstimatedRepairCost} vs replacement cost £${repair.ReplacementCost} (${((repair.RepairCostPercentage || 0) * 100).toFixed(0)}%).`),
      ])
    );
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [
        el("label", {}, "Manager Decision *"),
        el("div", { class: "pill-toggle", id: "manager-decision-toggle" }, [
          el("button", { type: "button", class: "active", "data-decision": "Approved" }, "Approved"),
          el("button", { type: "button", "data-decision": "Rejected" }, "Rejected"),
        ]),
      ]),
      el("div", { class: "field span-2" }, [el("label", {}, "Decision Notes"), el("textarea", { name: "DecisionNotes" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Record Decision")]),
    ]);
    wrap.appendChild(form);

    let decision = "Approved";
    form.querySelector("#manager-decision-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-decision]");
      if (!btn) return;
      decision = btn.dataset.decision;
      form.querySelectorAll("#manager-decision-toggle button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      if (!(await requirePin(`Repair Decision — ${decision}`))) return;

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const patch = { ManagerDecision: decision, DecisionDate: todayISO(), DecisionNotes: fd.get("DecisionNotes") || null };
        if (decision === "Rejected") {
          patch.BeyondRepair = true;
          patch.RetirementRecommendation = true;
          patch.RetirementDecision = "Awaiting Decision";
        }
        await saveRepair(patch);
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Repair cost decision for ${asset.AssetName} (${asset.id}): ${decision}` });
        toast(`Manager decision recorded: ${decision}`, "success");
        renderStage();
      } catch (err) {
        console.error(err);
        toast("Could not record decision: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    return wrap;
  }

  /* ---------------- Stage 3: Actual Repair Details ---------------- */
  function renderRepairDetailsStage() {
    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field" }, [el("label", {}, "Repair Date *"), el("input", { type: "date", name: "RepairDate", required: "required", value: todayISO() })]),
      el("div", { class: "field" }, [el("label", {}, "Repair Cost (£) *"), el("input", { type: "number", step: "0.01", min: "0.01", name: "RepairCost", required: "required" })]),
      el("div", { class: "field span-2" }, [
        el("label", {}, "Repair Notes *"),
        el("textarea", { name: "RepairNotes", required: "required", placeholder: "Details of repair work carried out" }, repair.RepairNotes || ""),
      ]),
      el("div", { class: "field" }, [el("label", {}, "Completion Date *"), el("input", { type: "date", name: "CompletionDate", required: "required", value: todayISO() })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Complete Repair")]),
    ]);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const repairDate = fd.get("RepairDate");
      const repairCost = Number(fd.get("RepairCost"));
      const notes = fd.get("RepairNotes");
      const completionDate = fd.get("CompletionDate");
      if (!repairDate) return toast("Repair Date is required.", "error");
      if (!repairCost || repairCost <= 0) return toast("Repair Cost is required and must be greater than £0.", "error");
      if (!notes) return toast("Repair Notes are required.", "error");
      if (!completionDate) return toast("Completion Date is required.", "error");
      if (new Date(completionDate) < new Date(repairDate)) return toast("Completion Date cannot be before the Repair Date.", "error");

      if (!(await requirePin(`Complete Repair — ${asset.AssetName}`))) return;

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await saveRepair({ RepairDate: repairDate, RepairCost: repairCost, RepairNotes: notes, CompletionDate: completionDate, RepairStatus: "Completed" });
        await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Available" });
        await recordMovement({ assetId: asset.id, action: "Repair Completed", notes });
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) repair completed — £${repairCost}` });
        finishRepair(el("p", {}, `${asset.AssetName} (${asset.id}) repaired and returned to Available.`));
      } catch (err) {
        console.error(err);
        toast("Could not complete repair: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    return form;
  }

  /* ---------------- Stage 4: Beyond Repair / Retirement ---------------- */
  function renderBeyondRepairStage() {
    const wrap = el("div", {});
    wrap.appendChild(el("div", { class: "form-section-heading" }, "Beyond Repair"));

    const rejectedBefore = repair.RetirementDecision === "Rejected";

    function fileInputAttrs(name, alreadyHave) {
      const attrs = { type: "file", name, accept: ".pdf,image/*" };
      if (!alreadyHave) attrs.required = "required";
      return attrs;
    }

    const form = el("form", { class: "field-grid" }, [
      el("div", { class: "field span-2" }, [
        el("label", {}, "Beyond Repair Report *"),
        el("input", fileInputAttrs("BeyondRepairReport", repair.BeyondRepairReport)),
      ]),
      el("div", { class: "field span-2" }, [
        el("label", {}, "Supporting Evidence *"),
        el("input", fileInputAttrs("SupportingEvidence", repair.SupportingEvidence)),
      ]),
      el("div", { class: "field span-2" }, [
        el("label", {}, "Damage Report *"),
        el("input", fileInputAttrs("DamageReport", repair.DamageReport)),
      ]),
      rejectedBefore
        ? el("div", { class: "field span-2" }, [
            el("label", {}, "Independent Technical Assessment *"),
            el("input", fileInputAttrs("IndependentTechincalAssessment", repair.IndependentTechincalAssessment)),
            el("span", { class: "hint" }, "Mandatory because the retirement recommendation was previously rejected."),
          ])
        : null,
      el("div", { class: "field span-2" }, [
        el("label", {}, "Retirement Decision *"),
        el("div", { class: "pill-toggle", id: "retirement-toggle" }, [
          el("button", { type: "button", class: "active", "data-decision": "Approved" }, "Approved"),
          el("button", { type: "button", "data-decision": "Rejected" }, "Rejected"),
        ]),
      ]),
      el("div", { class: "field span-2" }, [el("label", {}, "Decision Notes"), el("textarea", { name: "DecisionNotes" })]),
      el("div", { class: "form-actions", style: "grid-column:1/-1;" }, [el("button", { type: "submit", class: "btn btn-primary" }, "Record Retirement Decision")]),
    ]);
    wrap.appendChild(form);

    let decision = "Approved";
    const toggle = form.querySelector("#retirement-toggle");
    toggle.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-decision]");
      if (!btn) return;
      decision = btn.dataset.decision;
      toggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const uploads = {};
        for (const field of ["BeyondRepairReport", "SupportingEvidence", "DamageReport", "IndependentTechincalAssessment"]) {
          const file = fd.get(field);
          if (file && file.size > 0) {
            const fref = ref(storage, `repair-beyond-repair/${asset.id}/${Date.now()}_${field}_${file.name}`);
            await uploadBytes(fref, file);
            uploads[field] = await getDownloadURL(fref);
          }
        }
        if (!repair.BeyondRepairReport && !uploads.BeyondRepairReport) return toast("Beyond Repair report is mandatory.", "error");
        if (!repair.SupportingEvidence && !uploads.SupportingEvidence) return toast("Supporting evidence must be attached.", "error");
        if (!repair.DamageReport && !uploads.DamageReport) return toast("A damage report is mandatory when an asset is beyond repair.", "error");
        if (rejectedBefore && decision === "Rejected" && !repair.IndependentTechincalAssessment && !uploads.IndependentTechincalAssessment) {
          return toast("An independent technical assessment is required when the retirement recommendation is rejected.", "error");
        }

        if (!(await requirePin(`Retirement Recommendation — ${decision}`))) return;

        const patch = {
          ...uploads,
          RetirementDecision: decision,
          DecisionDate: todayISO(),
          DecisionNotes: fd.get("DecisionNotes") || null,
        };

        if (decision === "Approved") {
          patch.RepairStatus = "Completed - Beyond Repair";
          await saveRepair(patch);
          await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), { Status: "Retired", Active: false });

          const retirementId = await nextId("RET", 4);
          const actorName = getActingAs().name || "Unknown";
          await setDoc(doc(db, COLLECTIONS.RETIREMENT_REGISTER, retirementId), {
            AssetID: asset.id,
            QRCode: asset.QRCode || null,
            OriginatingProcess: "Repair",
            OriginatingProcessID: repair.id,
            RetirementReason: "Beyond Repair",
            RetirementStatus: "Awaiting Disposal",
            OutstandingActionsCheck: false,
            OutstandingActions: null,
            ActionsResolved: false,
            ActionsResolvedDate: null,
            ManagerDecision: "Approved",
            DecisionDate: todayISO(),
            DecisionNotes: fd.get("DecisionNotes") || null,
            DeclineReason: null,
            DisposalMethod: null,
            DisposalReference: null,
            DisposalCompletionDate: null,
            DisposalStatus: "Await Disposal",
            RetirementCompletedDate: null,
            AssetInactive: true,
            AllocationBlocked: true,
            CreatedDate: nowISO(),
            CreatedBy: actorName,
            LastUpdatedDate: nowISO(),
            LastUpdatedBy: actorName,
          });

          await recordMovement({ assetId: asset.id, action: "Retired — Beyond Repair", notes: `Repair job ${repair.id} closed; retirement ${retirementId} created` });
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `${asset.AssetName} (${asset.id}) retired — beyond repair` });
          finishRepair(
            el("div", {}, [
              el("p", {}, `${asset.AssetName} (${asset.id}) has been retired — beyond repair.`),
              el("p", { class: "muted" }, `Retirement record ${retirementId} created and awaiting disposal (not yet a full module — logged for now).`),
            ])
          );
        } else {
          await saveRepair(patch);
          await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Retirement recommendation rejected for ${asset.AssetName} (${asset.id}) — independent assessment requested` });
          toast("Retirement recommendation rejected — independent technical assessment recorded. Job remains open.", "info");
          renderStage();
        }
      } catch (err) {
        console.error(err);
        toast("Could not record retirement decision: " + err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });

    return wrap;
  }

  function finishRepair(node) {
    document.getElementById("detail-card").style.display = "none";
    const card = document.getElementById("result-card");
    const body = document.getElementById("result-body");
    body.innerHTML = "";
    body.appendChild(node);
    body.appendChild(el("div", { style: "margin-top:10px;" }, el("a", { class: "text-link", href: `asset-record.html?id=${encodeURIComponent(asset.id)}` }, "Open asset record →")));
    card.style.display = "";
    repair = null;
    asset = null;
    loadQueue();
  }

  async function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const assetParam = params.get("asset");
    if (assetParam) await loadRepair(assetParam);
  }

  init().then(applyUrlParams);
</script>
</body>
</html>
