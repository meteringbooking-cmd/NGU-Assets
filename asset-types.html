<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Types · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div class="page-toolbar">
    <input type="search" class="search-input" id="search-input" placeholder="Search asset types…" />
    <button class="btn btn-primary" id="add-btn">+ Add Asset Type</button>
  </div>

  <div class="card">
    <table class="data-table">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Category</th><th>Calibration Required</th><th>Repairable</th><th>Service Life</th><th>Status</th></tr>
      </thead>
      <tbody id="rows"><tr class="loading-row"><td colspan="7">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { db } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import { initLayout, el, $, toast, debounce, nextId, logAudit, fetchAll, openModal, closeModal, getActingAs, nowISO } from "./shared/common.js";
  import { doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  initLayout("asset-types", "Asset Types");

  const CAL_UNITS = ["Days", "Months", "Years"];
  let allTypes = [];
  let allCategories = [];

  async function load() {
    document.getElementById("rows").innerHTML = `<tr class="loading-row"><td colspan="7">Loading…</td></tr>`;
    [allTypes, allCategories] = await Promise.all([
      fetchAll(COLLECTIONS.ASSET_TYPES),
      fetchAll(COLLECTIONS.ASSET_CATEGORIES, { activeOnly: true }),
    ]);
    allTypes.sort((a, b) => (a.AssetTypeName || "").localeCompare(b.AssetTypeName || ""));
    render();
  }

  function yesNo(v) {
    return el("span", { class: `badge ${v ? "badge-green" : "badge-slate"}` }, v ? "Yes" : "No");
  }

  function render() {
    const tbody = document.getElementById("rows");
    const term = ($("#search-input").value || "").toLowerCase();
    tbody.innerHTML = "";
    const rows = allTypes.filter((r) => !term || [r.AssetTypeName, r.AssetCatergory].join(" ").toLowerCase().includes(term));
    if (rows.length === 0) {
      tbody.appendChild(el("tr", { class: "static-row" }, el("td", { colspan: "7", class: "empty-state" }, "No asset types yet — add a category first, then create asset types under it.")));
      return;
    }
    rows.forEach((r) => {
      tbody.appendChild(
        el("tr", { onclick: () => openForm(r) }, [
          el("td", {}, r.id),
          el("td", {}, r.AssetTypeName),
          el("td", {}, r.AssetCatergory || "—"),
          el("td", {}, yesNo(r.CalibrationRequired)),
          el("td", {}, yesNo(r.Repairable)),
          el("td", {}, r.ExpectedServiceLife ? `${r.ExpectedServiceLife} yrs` : "—"),
          el("td", {}, el("span", { class: `badge ${r.Active === false ? "badge-slate" : "badge-green"}` }, r.Active === false ? "Inactive" : "Active")),
        ])
      );
    });
  }

  document.getElementById("search-input").addEventListener("input", debounce(render, 150));
  document.getElementById("add-btn").addEventListener("click", () => openForm(null));

  function openForm(existing) {
    if (allCategories.length === 0) {
      toast("Add at least one Asset Category first.", "info");
      return;
    }
    const form = el("form", { class: "field-grid" });
    form.innerHTML = `
      <div class="form-section-heading">Asset Type Information</div>
      <div class="field"><label>Asset Type Name *</label><input name="AssetTypeName" required maxlength="100" placeholder="e.g. Voltage Tester" /></div>
      <div class="field">
        <label>Asset Category *</label>
        <select name="AssetCatergory" required>
          <option value="">Select…</option>
          ${allCategories.map((c) => `<option value="${c.AssetCategoryName}">${c.AssetCategoryName}</option>`).join("")}
        </select>
      </div>
      <div class="field span-2"><label>Description *</label><textarea name="Description" required maxlength="500"></textarea></div>
      <div class="field checkbox-row"><input type="checkbox" name="Active" id="chk-active" /><label for="chk-active">Active</label></div>

      <div class="form-section-heading">Asset Rules</div>
      <div class="field checkbox-row"><input type="checkbox" name="CalibrationRequired" id="chk-cal-req" /><label for="chk-cal-req">Calibration Required</label></div>
      <div class="field checkbox-row"><input type="checkbox" name="Repairable" id="chk-repairable" /><label for="chk-repairable">Repairable</label></div>
      <div class="field"><label>Expected Service Life (years) *</label><input type="number" name="ExpectedServiceLife" required min="0" /></div>

      <div class="form-section-heading">Calibration Defaults</div>
      <div class="field"><label>Calibration Interval *</label><input type="number" name="CalibrationInterval" required min="1" value="12" /></div>
      <div class="field">
        <label>Calibration Unit *</label>
        <select name="CalibrationUnit" required>${CAL_UNITS.map((u) => `<option value="${u}">${u}</option>`).join("")}</select>
      </div>

      <div class="form-actions" style="grid-column:1/-1;">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">${existing ? "Save Changes" : "Create Asset Type"}</button>
      </div>
    `;

    if (existing) {
      Object.entries(existing).forEach(([k, v]) => {
        const input = form.querySelector(`[name="${k}"]`);
        if (!input) return;
        if (input.type === "checkbox") input.checked = !!v;
        else input.value = v ?? "";
      });
    } else {
      form.querySelector('[name="Active"]').checked = true;
      form.querySelector('[name="CalibrationUnit"]').value = "Months";
    }

    const panel = openModal(existing ? `Edit Asset Type — ${existing.AssetTypeName}` : "Add Asset Type", form, { wide: true });
    panel.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = {
        AssetTypeName: fd.get("AssetTypeName"),
        AssetCatergory: fd.get("AssetCatergory"),
        Description: fd.get("Description"),
        Active: form.querySelector('[name="Active"]').checked,
        CalibrationRequired: form.querySelector('[name="CalibrationRequired"]').checked,
        Repairable: form.querySelector('[name="Repairable"]').checked,
        ExpectedServiceLife: Number(fd.get("ExpectedServiceLife")),
        CalibrationInterval: Number(fd.get("CalibrationInterval")),
        CalibrationUnit: fd.get("CalibrationUnit"),
      };
      try {
        if (existing) {
          await updateDoc(doc(db, COLLECTIONS.ASSET_TYPES, existing.id), data);
          await logAudit({ recordType: "AssetType", recordId: existing.id, action: "Update", description: `Updated asset type ${data.AssetTypeName}` });
          toast("Asset type updated", "success");
        } else {
          const id = await nextId("TYPE", 4);
          data.CreatedDate = nowISO();
          data.CreatedBy = getActingAs().name || "Unknown";
          await setDoc(doc(db, COLLECTIONS.ASSET_TYPES, id), data);
          await logAudit({ recordType: "AssetType", recordId: id, action: "Create", description: `Created asset type ${data.AssetTypeName}` });
          toast("Asset type created", "success");
        }
        closeModal();
        load();
      } catch (err) {
        toast("Could not save: " + err.message, "error");
      }
    });
  }

  load();
</script>
</body>
</html>
